body:
  text: 唐百家詩選卷十四宋王安石編武元衡四首途次近蜀驛蒙恩賜寶刀并借馬使還奉寄中書李鄭二相草草事行役遲遲出故關碧幢遙隔霧紅斾漸依山感激慙恩淚風霜去國顔捧刀金賜字歸馬玉連環龍鳯辭三署干戈護八蠻應憐宣室召溫樹不同攀早秋西亭宴徐員外鼎鉉辭台座麾幢領益州曲池連月曉橫笛滿城秋有美皇華使曽同白社遊今來重相見偏覺豔歌愁夏夜作夜久喧暫息池臺惟月眀無因駐清景日出事還生送唐君次都門去馬嘶灞水春流淺青槐驛路直白日離亭晚望望煙景微草色行人逺令狐楚四首發潭州日寄李寧常侍君今侍紫垣我已墮青天委廢從兹日旋歸在幾年心為西靡樹眼是北流泉更過長沙去江風滿驛船郢城秋懷寄江州錢徽侍郎晚嵗俱為郡新秋各異鄉燕鴻一驚呌郢樹逺青蒼山露侵衣潤江風捲簟涼相思如漢水日夜向潯陽贈符道士偶逢蒲家郎乃是葛仙客行常乘青竹飢即煮白石腰間嫌大組心內保尺宅我願從之遊深山鎖玉液鄂州使至竇鞏中丞副使見示與元稹相公獻酬之什余頃任户部尚書日中丞是當司外郎每有篇章多相唱和因題四韻以寄所懷仙吏秦城别新詩鄂渚來才推今八斗職副舊三台雕鏤心偏許緘封手自開何年相贈答却得在中臺劉言史十七首瀟湘遊夷女采山蕉緝紗浸江水野花滿髻妝色新間歌款乃深峽裏款乃知從何處生當時泣舜腸斷聲翠華寂寞嬋娟沒野篠空餘紅淚情青煙冥冥覆杉桂崖壁凌天風雨細昔人幽恨此地遺緑芳紅豔含怨姿清猿未盡鼯鼠切淚水流到湘妃祠北人莫作瀟湘遊九疑雲入蒼梧愁放螢怨放螢去不須留聚時年少今白頭架中科斗萬餘卷一字千回重照見青雲杳眇不可親開囊欲放增餘怨且逍遙還酩酊仲舒漫不窺園井那將寂寞老病身更求微蟲借光影欲放時淚沾裳衝籬落千點光觀繩伎潞府李相公席上作泰陵遺樂何最珍綵繩冉冉天仙人廣場寒食風日好百夫伐鼓錦臂新銀畫青綃抹雲髮髙處綺羅香更切重肩接立三四層著屐背行仍應節兩邊丸劎漸相迎側身交步何輕盈閃然欲落却收得萬人肉上寒毛生危機險勢無不有倒挂纎腰學垂柳下來一一芙蓉姿粉薄鈿稀態轉竒座中還有沾巾者曽見先皇初教時買花謡杜陵村人不田穡入谷經溪復緣壁每至南山草木春即向侯家取金碧幽豔凝華春景曙採夫移得將何處蝶惜芳容送下山尋斷孤香始回去豪少居連鳷鵲東千金使買一株紅院多花少栽未得零落緑蛾纖指中咸陽貴戚長安里無限將金買花子澆紅濕緑千萬家青絲玉轤聲啞啞送婆羅門歸本國剎利王孫字迦攝竹錐橫寫吒蘿葉遙知漢地未有經手牽白馬繞天行龜兹磧西胡雪黑大師凍死來不得地盡年深始到船海裏更行三十國行多耳斷金環落冉冉悠悠不停腳馬死經留却去時往來應盡一生期出漢獨行人絶處磧西天漏雨絲絲春過趙墟下馬邯鄲陌頭歇寂寥崩隧臨車轍古柏重生枝亦乾餘漆見風幽熖滅白蒿微微紫槿新行人感此復悲春王中丞宅夜觀舞胡騰石國胡兒人見少躑舞樽前急如鳥織成蕃帽虛頂尖細㲲胡衫雙袖小手中拋下蒲桃盞西顧忽思鄉路逺跳身轉轂寶帶鳴弄腳繽紛錦鞾軟四坐無言皆瞪目橫笛琵琶遍頭促亂騰新毯雪朱毛傍拂輕花下紅燭酒闌舞罷絲管絶木槿花西見殘月葛巾歌貝州漳南縣贈楊炯􅀈一片白葛巾潛夫自能結籬邊折枯蒿聊用簪華髮有時醉倒長松側酒醒不見心還憶谷鳥銜將却趁來野風吹去還尋得十年紫竹溪南住迹同玄豹依深霧草堂忩底漉春醅山寺門前逢暮雨臨汝袁郎得相見間雲引到東陽縣魯性將他類此身還拈野物贈傍人空留梲杖犢鼻褌濛濛煙雨歸山村與孟郊洛北野泉上煎茶粉細越笋牙野煎寒溪濵恐乖靈草性觸事皆手親敲石取鮮火撇泉避腥鱗熒熒爨風鐺拾得墜巢薪潔色既爽别浮氲亦殷勤以兹委曲靜求得正味真宛如摘山時自啜指下春湘瓷泛輕花滌盡昏渴神此遊愜醒趣可以話髙人初下東周贈孟郊時依鄭相鶴老耳更工龜死殼亦靈正性非外沿終始全本情童子不戲塵積書就嵓扃身著木葉衣養鹿兼牸耕偶隨下山雲荏苒失故程漸入機險中危思難太行十髮九縷絲悠然東周城言詞野麋態出口多纍形因依漢元寮未似羈絏經冷竈助新熱靜砧與寒聲斷蓬在闉闌豈當桃李榮寄食若蠧蟲侵損利微生固非拙為強懦劣外療并素堅氷蘗心潔立保賢貞修文返正風刋字齊古經慙將衰末分髙棲喧世名北原情三首錯莫天色愁挽歌出重闉誰家白網車送客入幽塵銘旌下官道葬輿去轔轔蕭條黃蒿中奠酒花翠新米雪晚霏微墓成悄無人烏鳶下空地煙火殘荒榛生人更多苦入户事盈身營營日易深却到不得頻寂寥孤隧頭草緑棠梨春洛陽城北山古今葬冥客聚骨朽成泥此山土多白近來送葬人亦去聞歸聲豈能車輪疾漸是墓侵城城中人不絶哀挽相次行莫非北邙後重向洛陽生卜地起孤墳全家送葬去歸來却到時不復重知處疊疊葬相續土乾草已緑裂紙瀉壺漿空向春雲哭林中獨醒晚來林沼靜獨坐間瓢樽向已非前迹齊心欲不言微涼生亂篠輕馥起孤萱未得渾無事瓜田草正繁江陵客舍留别樊尚書信陵門館下多病有歸思墜履忘情後寒灰更濕時委欄芳蕙晚憑几雪髫垂明日秋關外單車風雨隨過春秋峽峭壁蒼蒼苔色新無風晴景自勝春不知何樹幽崖裏臘月開花似北人竹裏梅竹與梅花相並枝梅花正發竹枝垂風吹總向竹枝上直似王家雪下時張碧二首題祖山人池上怪石寒姿數片竒突兀曽作秋江秋水骨先生應是壓風雷著向池邊塞龍窟我來池上傾酒樽半酣書破青煙䀶參差翠縷擺不落筆頭驚怪粘秋雲我聞吳中項容水墨有髙價邀得將來倚松下鋪却雙繒直道難掉首空歸不成畫野田行風昏晝色飛斜雨寃骨千堆髑髏語八紘牢落人物稀盡是田園荒廢主悲嗟自古爭天子幾度乾坤復如此秦皇矻矻築長城漢主區區白蛇死野田之骨兮又成塵樓閣風煙兮還復新願作華山之下長歸馬野田無復堆寃者李涉三十七首渤之兄也大和中為太學博士濉陽行黃昏日暮驅羸馬夜宿濉陽烽火下此地新經殺戮來墟落無煙空碎瓦層氷塞斷隋朝水一道銀河貫千里愁心翻覆夢難成病僕呻吟呼不起泗水三千招義軍本自征戰邀殊勳十年麾下畜壯氣一朝此地為愁雲昨日太陽回照燭轉見天心重含育早晚東風的發生古堤春草年年緑六歎并序五噫四愁九歌七啓皆創文者立意之終紀其數而名之也清江白雲孤山逺嶼皆得時之人吟詠性情耳余無暇於是焉窮居嵗隂偶懷無悰因追感聞見成文六篇目曰六歎懼質文之不備復何全於比興乎録之私齋以示同道格韻枮缺多慚見知綺幕香風翡翠車清明獨傍芙蓉渠上有雲鬟洞仙女垂羅掩穀煙中語風月頻驚桃李時滄波久别鴛鴻侶欲傳一札孤飛翼山長水逺無消息却鎖重關一院深半夜空庭明月色蓬萊島邊採珠客西望人寰星漢隔千重疊浪聳雲髙萬里平沙連月白海中洞穴尋難極水底鮫人半相識玄蚌初開影暫明驪龍欲近威難逼辛苦風濤白首期得珠却恨求珠時隋侯殁世幾千載只今薄俗空嗤嗤燕王愛賢築金臺四方豪俊承風來秦皇燒書殺儒客肘腋之中千里隔去年八月幽并道昭王陵邊哭秋草今年二月遊函關秦家城外悲河山河上山邊車馬路殘日青煙五陵樹關東病儒客梁城五嵗十回逢亂兵燒人之家食人肉狼虎熾心都未足城裏愁雲晝不開城頭野草春還緑五十餘年忠烈臣臨危守節羞謀身堂上英髦沉白刃門前輿𨽻乘朱輪千古傷心汴河水隂天落日悲風起漢臣一沒丁零塞牧羊西過隂沙外朝憑南雁信難回夜望北辰心獨在漢家茅土橫九州髙門長戟分王侯但將鍾鼓恱私愛肯以犬戎為國羞夜宿寒雲卧氷雪嚴風獨刃縣旌節丁年奉使白頭歸泣盡李陵衣上血深院梧桐夾金井上有轆轤青絲索美人清晝汲寒泉寒泉欲上銀瓶落迢迢碧甃千餘尺竟日倚欄空歎息惆悵不來照明鏡却掩洞房花寂寂題清溪鬼谷先生舊居翠壁開天池青崖列雲樹水容不可狀杳若秋河霧常聞先生教指示秦儀路二子材不同逞詞過尺度偶因從吏役逺到冥棲處松月想舊山煙霞了如故未遑錬金鼎日覺容光暮萬慮隨境生何由返真素寂寞天籟息清迥鳥聲曙回首望重重無期挹風馭間中記事想吳楚舊遊寄河陽從事楊潛憶昨天台尋石梁赤城枕下看扶桑金烏欲上海如血翠色一點蓬萊光安期先生不可見蓬萊目極滄海長回舟偶得風水便煙帆數夕歸瀟湘瀟湘水清嵓嶂曲夜宿朝遊常不足一自無名身事間五湖雲月偏相屬進者恐不營退者恐不深魚遊鳥逝兩雖異彼此各有遂生心身解耕耘妾能織嵗晏飢寒免相逼稚子年才七嵗餘漁樵一半分渠力吾友從軍在河上腰佩吳鈎佐飛將偶與嵩山道士期西尋汴水來相訪見君顔色猶憔悴知君未展心中事落日驅車出孟津髙歌共歎傷心地洛邑秦城小年别兩都陳事空聞説漢家天子不東遊古木行宫蔽煙月洛濱老翁年八十西望殘陽臨水泣自言生長開元中武皇恩化親霑及當時天下無甲兵雖聞賦斂毫毛輕紅車翠蓋滿衢路洛中歡笑爭逢迎一從戎馬來幽薊函谷虎狼無捍制九重宫殿閉豺狼萬國生人自相噬蹭蹬瘡痍今不平干戈南北常縱橫中原膏血焦欲盡四郊貪將猶憑陵秦中豪寵爭出羣巧將言智寬明君南山四皓不敢語渭上釣人何足云君不見昔時槐栁八百里路傍五月清隂起只今零落幾株殘枯根半死黃河水醉中贈崔膺與君兄弟匡嶺故與君相逢揚子渡白浪南分吳塞雲緑楊西入隋宫路隋家文物今雖改舞館歌臺基尚在煬帝陵邊草木深汴河流水空歸海今古悠悠人自别此地繁華終未歇大道青樓夾翠煙瓊墀繡帳開明月與君一言兩相許外捨形骸中爾汝揚州歌酒不可追洛神映箔湘妃語白馬黃金為身置誰能獨羡他人醉暫到香爐一夕間能展愁眉百年事君看白日光如箭一度别來顔色變早謀侯印佩腰間莫遣看花鬢如霰嶽陽别張祜秀才十年蹭蹬為逐臣鬢毛白盡巴江春鹿鳴猿嘯雖寂寞水蛟山魅多精神山瘧困中聞有赦死灰不望光隂借半夜州符喚牧童虛教衰病生驚怕巫峽洞庭千里餘蠻陬水國何親疏由來真宰不宰我徒勞歎者懷吹噓霸橋昔與張生别萬變桑田何處説龍蛇縱在沒泥塗長衢却為駑駘設愛君氣堅風骨峭文章真把江淹笑洛下諸生懼刺先烏鳶不得齊鷹鷂嶽陽西南湖上寺水閣松房遍文字新釘張生一首詩自餘吟著皆無味䇿馬前途須努力莫學龍鍾虛歎息却歸巴陵途中走筆寄唐知言去年臘月來夏口黑風白浪打頭吼櫓聲軋軋搖不前看他撩亂張帆走逾月始到鸚鵡洲嗚嗚暮角喧城頭逡巡未得見官長夢寢但覺生愁憂中軍賢倅李監察人馬曉來兼手札教令參謁禮數全頭頭要處相稱掣唐氏一門今五龍聲華殷殷皆如鍾就中十一最年少别有俊氣橫心胸巧綴五言才刮骨却怕柱天身硉矹後輩無勞續出頭坳塘不合窺溟渤君家三兄舊山侣方寸久來常許與不覺淹留兩月餘風光漫爛生洲渚宇文文學儒家子竹繞書齋花映水醉舞狂歌此地多有時酩酊扶還起猥蒙方伯憐飢貧假名許得陪諸賓酒家債負有填日恣意頗敢排青緡余瞿二家同愛客園蔬任遣奴人摘野狐泉頭銀葉方一别十年今再覿更有風流歙奴子能將盤帕來欺爾白馬青袍豁眼明許他真是查郎髓良會芳時難再來隟光電影長相催扁舟惆悵人南去目斷江天凡幾回春山三朅來釣魚朅來春日暖沿溪不厭舟行緩野竹初裁碧玉長澄潭欲下青絲短昔人避世兼避仇暮栖雲外朝悠悠我今無事亦如此赤鯉忽到長竿頭泛泛隨波凡幾里碧莎如煙沙似砥瘦壁橫空怪石危山花鬬日禽爭水有時帶月歸扣舷身間自是漁家仙山上朅來採新茗新花亂發前山頂瓊英動搖鍾乳碧叢叢髙下隨崖嶺未必蓬萊有仙藥能向鼎中雲漠漠越甌遙見裂鼻香欲覺身輕騎白鶴採藥朅來藥苖盛藥生只傍行人徑世人重耳不重目指似藥苖心不足野客住山三十載妻兒共寄浮雲外小男學語便分别已辨君臣知配匹都市廣場開大鋪疾來求者多相誤見説韓康舊姓名識之不識先相怒山中五無奈何無奈落葉何紛紛滿衰草疾來無氣力擁户不能掃欲訪雲外人都迷上山道無奈澗水何喧喧夜鳴石疏林透斜月散亂金光滴欲訪澗底人路窮潭水碧無奈牧童何放牛喫我竹隔林呼不應呌笑如生鹿欲報田舍翁更深不歸屋無奈阿鼎何嬌啼索梨栗柴門正風雨千向千回出欲識老病心賴渠將過日無奈梅花何滿嵓光似雪春風總未至獨自驚時節欲見惆悵心又看花上月牧童詞朝牧牛牧牛下江曲夜牧牛牧牛村口谷荷蓑出林春雨細蘆管卧吹沙草緑亂插蓬蒿箭滿腰不怕猛虎欺黃犢題鶴林寺僧室終日昏昏醉夢間忽聞春盡強登山因過竹院逢僧話又得浮生半日間春晚遊鶴林寺寄使府諸公野寺尋春花已遲背嵓唯有兩三枝平明携酒猶堪醉為報春風且莫吹題開聖寺宿雨初收草木濃羣鴉飛散下堂鍾長廊無事僧歸院盡日門前獨看松再葺夷陵幽居負郭依山一徑深萬竿如束翠沉沉從來愛物多成癖辛苦移家為竹林過襄陽寄上于司空相公方城漢水舊城池陵谷依然世自移歇馬獨來尋故事逢人唯説峴山碑送魏簡能東遊二首獻賦論兵命未通却乘羸馬出關東灞陵原上重回首十載長安似夢中燕市悲歌又送君目隨征鴈過寒雲孤亭宿處時看劔莫使塵埃蔽斗文陜中遇赦寄秦洛舊知天網初開釋楚囚殘骸已廢自知休荷蓑不是人間事歸去滄江有釣舟題連雲堡由來天地有關扄斷壑連山接杳冥一出縱知邊上事滿朝誰信語堪聽從秦城回再題武關逺别秦城萬里遊亂山髙下出商州關門不鎖寒溪水一夜潺湲送客愁題宇秀才櫻桃風光莫占少年家白髮殷勤最戀花今日顚狂君莫笑趁愁得醉眼麻嗏題月水臺平流白日無人愛橋上間行若箇知水似晴天天似水兩重星點碧琉璃黃葵花此花莫遣俗人看新染鵝黃色未乾好逐秋風天上去紫陽宫女要頭冠别南溪二首如雲不猒蒼梧逺似雁逢春又北飛唯有隱山溪上月年年相望兩依依常歎春泉去不回我今此去更難來欲知别後留情處手種巖花次第開井欄砂宿遇夜客暮雨蕭蕭江上村緑林豪客夜知聞他時不用逃名姓世上如今半是君唐百家詩選卷十四
