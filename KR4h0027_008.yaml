  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4h0027_WYG_008-1a, image: WYG1344/WYG1344-0631c.png}
body:
  text: 唐百家詩選卷八宋王安石編錢起六首送畢侍御謫居崇蘭香死玉簮折志士吞聲甘徇節忠藎不為明主知悲來莫向時人説滄浪之水見心清楚客辭天淚滿纓百鳥喧喧噪一鶚上林高枝亦難托寧嗟人世棄虞翻且喜江山得康樂自憐黃綬老嬰身妻子朝來勸隱淪桃花洞裏舉家去此别相思復幾春送李秀才落第遊荆楚翠羽雖成夢遷鶯尚後羣名逃郤詵策興發謝玄文昏旦扁舟去江山幾路分上潮吞海日歸雁出湖雲詩思應須苦猿聲莫厭聞離居見新月那得不思君贈閣下閻舍人二月黃鶯飛上林春城紫禁晚隂隂長樂鐘聲花外盡龍池栁色雨中深陽和不散窮途恨霄漢常懸捧日心獻賦十年猶未遇羞將白髮對華簪和宣城張太守南亭秋夕懷友池館蟪蛄聲梧桐秋露晴月臨朱戟靜河近畫樓明卷幔浮涼入聞鐘永夜清片雲懸曙斗數雁過秋城羽扇揚風暇瑶琴寄别情江山飛麗藻謝朓讓前名暮春歸故山谷口殘春黃鳥稀辛夷花盡杏花飛始憐幽竹山窗下不改清隂待我歸駕幸溫泉宫和李員外作未央月曉度疏鐘鳳輦時巡出九重雪霽山門迎瑞日雲開水殿候飛龍輕寒不入宫中樹佳氣常薰仗外峰遙羡枚臯扈仙蹕偏承霄漢渥恩濃盧綸三十六首送吉中孚校書歸楚州舊山中孚自仙官入仕青袍藝閣郎談笑揖侯王舊籙藏雲穴新詩滿帝鄉名高間不得到處人爭識誰知冰雪顔已雜風塵色此去復如何東臯岐路多藉芳臨紫陌回首憶滄波年來倦蕭索但説淮南樂並楫湖上遊連檣月中泊沿溜入閶門千燈夜市喧喜逢鄰舍伴遙語問鄉園下淮風自急樹杪分郊邑送客隨岸行離人出帆立漁村繞水田淡淡隔晴煙欲就林中醉先期石上眠林昏天未曙但向雲邊去暗入無路山心知有花處登高日轉明下望見春城洞裏草空長冢邊人自耕寥寥行異境過盡千峰影露色凝古壇泉聲落寒井仙成不可期多别自堪悲為問桃源客何人見亂時與從弟瑾同下第後出關言别同作金門獻賦人二年悲見故園春到闕不沾新雨露還家空帶舊風塵雜花飛盡栁隂隂官路逶迤緑草深對酒已成千里客望山空寄兩鄉心出關愁暮一沾裳滿野蓬生古戰場孤村樹色昏殘雨逺寺鐘聲帶夕陽和李使君三郎早秋城北亭宴崔司士因寄關中弟張評事時遇作黃花古城路上盡見青山桑柘晴川口牛羊落照間野情隨卷幔軍事隔重關道合偏多賞官微獨不間鶴分琴久罷書到雁應還為謝登龍客瓊枝寄一攀逢病軍人行多有病住無糧萬里還鄉未到鄉蓬鬢哀吟古城下不堪秋氣入金瘡村南逢病叟雙膝過頤頂在肩四鄰知姓不知年臥驅鳥雀惜禾黍猶恐諸孫無社錢送張郎中還蜀歌秦家御史漢家郎親專兩印征殊方功成走馬朝天子伏檻論邊若流水曉離仙署趨紫微夜接高儒讀青史瀘南五將望君還願以天書示百蠻曲棧重江初過雨前旌後騎不同山迎車拜舞多耆老舊卒新營遍青草塞口雲生火候遲煙中鶴唳軍行早黃花川下水交橫逺映孤霞蜀國晴笻竹筍長椒瘴起荔枝花發杜鵑鳴回首岷峨半天黑傳觴接膝何由得空令豪士仰威名無復貧交恃顔色垂楊不動雨紛紛錦帳胡瓶爭送君須臾醉起簫笳發空見紅旌入白雲臘日觀咸寧王部曲娑勒擒豹歌山頭曈曈日將出山下獵圍照初日前林有獸未識名將軍促騎無人聲潛形踠伏草不動雙雕轉旋羣鴉鳴隂方質子才三十譯語受詞蕃語揖捨鞍解甲疾如風人忽虎蹲獸人立歘然扼顙批其頤爪牙委地涎淋漓既蘇復吼拗於絞反仍怒果叶英謀生致之拖自深叢目如電萬夫失容千馬戰傳呼賀拜聲相連殺氣騰凌隂滿川始知縛虎如縛鼠敗虜降羌生眼前祝爾嘉詞爾無苦獻爾將隨犀象舞苑中流水禁中山期爾攫搏開天顔非熊之兆慶無極願紀雄名傳百蠻和張僕射塞下曲月黑雁飛高單于夜遁逃欲將輕騎逐大雪滿弓刀從軍行二十在邊城軍中得勇名卷旗收敗馬占磧擁殘兵覆陳烏鳶起燒山草木明塞間思逺獵師老厭分營雪嶺無人迹冰河有雁聲李陵甘此沒惆悵漢公卿逢南中使因寄嶺外故人見説南來處蒼梧接桂林過秋天更暖邊海日長隂巴路緣雲出蠻鄉入洞深信回人自老夢到月應沈碧水通春色青山寄逺心炎方難久客為爾一沾襟代員將軍罷戰後歸舊里贈朔北故人結髮事壃場全生俱到鄉連雲防鐵嶺同日破漁陽牧馬胡天晚移軍磧路長枕戈眠古戍吹角立繁霜歸老勳仍在酬恩虜未亡獨行過邑里多病對農桑雄劒依塵席隂符寄藥囊空餘麾下將猶逐羽林郎江北憶崔汶夜問江西客還知在楚鄉全身出部伍盡室逐漁商晴日遊瓜步新年到漢陽月昏驚浪白瘴起覺雲黃望嶺家何處登山淚幾行閩中傳有雪應且住南康早春歸盩厔舊居却寄耿拾遺湋李校書端野日初晴麥隴分竹園村巷鹿成羣萬家廢井生新草一樹繁花對古墳引水忽驚冰滿澗向田空見石和雲可憐芳歲青山下唯有松枝好寄君夜中得循州趙司馬侍郎書因寄回使瘴海寄雙魚中宵達我居兩行燈下淚一紙嶺南書地説炎蒸極人稱老病餘殷勤報賈傅莫共酒杯踈太白西峰偶宿車祝二尊師石室晨登前巘慿眺書懷即事寄呈鳳翔齊員外張侍御弱齡誠昧鄙遇勝惟求止如何羇滯中得步青冥裏青冥有桂叢冰雪兩仙翁毛節未歸海丹梯間倚空逍遙擬上清洞府不知名醮罷雨常至客辭山忽明山明鳥聲樂日氣生巖壑巖壑樹修修白雲如水流白雲銷散盡隴塞儼然秋積阻關河固綿聨烽戍稠五營承廟略四野失邊愁吁嗟繫塵役又負靈仙迹芝术自芳香泥沙幾沈溺書此欲沾衣平生事每違煙霄不可仰鸞鶴自追飛同耿湋宿陸澧旅舍當軒雲月開清夜故人杯擁褐覺霜下抱琴聞雁來迎風君顧步臨路我遲回雙鬢共如此此歡非易陪題苗員外竹間亭高甃絶行塵開簾似有春風傾竹上雪山對酒邊人步暖先逢日書空逺見鄰還同內齋暇登賞及諸姻早春遊樊川野居却寄李端校書兼呈崔洞補闕司空曙主簿耿湋拾遺白水遍溝塍青山對杜陵晴明人望鶴曠野鹿隨僧古栁連巢折荒隄帶草崩隂橋全覆雪瀑溜半垂冰鬭鼠搖松影遊龜落石層韶光偏不待衰敗巧相仍桂樹曾爭折龍門幾共登琴師阮校尉詩和栁吳興舐筆求書扇張屏看畫蠅卜鄰空遂約問卦獨無徵投足經危路收材遇直繩守農窮自固行藥病何能掩帙蓬蒿晚臨川景氣澄颯然成一叟誰更慕騫騰春日登樓有懷花正濃時人正愁逢花却欲替花羞年來笑伴皆歸去今日晴明獨上樓長安春望東風吹雨過青山却望千門草色間家在夢中何日到春來江上幾人還川原繚繞浮雲外宫闕參差落照間誰念為儒逢世難獨將衰鬢客秦關山中一絶飢食松花渴飲泉偶從山後到山前陽坡軟草厚如織因與鹿麛相伴眠同薛存誠登栖巖寺衰蹇步難前上山如上天塵泥來自晚猿鳥到何先萬壑應孤磬百花通一泉蒼蒼此明月下界正沈眠賊中與嚴越卿曲江看花紅枝欲折紫枝殷隔水連宫不用攀會待長風吹落盡始能開眼向青山夜投豐德寺謁液上人半夜風中有磬聲偶逢樵者問山名上方月曉聞僧語下路林疏見客行野鶴巢邊松最老毒龍潛處水偏清願得逺公知姓字焚香洗鉢過浮生酬李端野寺病居見寄野寺昏鐘山正隂亂藤高竹水聲深田夫就餉還依草野雉驚飛不過林齋沐暫思同靜室清羸已覺助禪心寂寞日長誰問疾料君惟取古方尋贈别李紛頭白乘驢懸布囊一回言别淚千行兒孫滿眼無歸處唯到樽前似故鄉送崔琦赴宣州幕五馬臨流待幕賓羡君談笑出風塵身間就養寧辭逺世難移家莫厭貧天際曉山三峽路津頭臘市九江人何處遙知最惆悵滿湖青草雁聲春至德中途中書事却寄李僴亂離無處不傷情況復看碑對古城路繞寒山人獨去月臨秋水雁空驚顔衰重喜歸鄉國身賤多慙問姓名今日主人還共醉應憐世故一儒生送鮑中丞赴太原分路引鳴騶喧喧似隴頭暫移西掖望全解北門憂專幕臨都護分曹制督郵積冰營不下盛雪獵方休白草連胡帳黃金擁戍樓今朝送旌斾一減魯儒羞晚到盩厔耆老家老翁曾舊識相引到柴門苦話别時事因尋溪上村數年何處客近日幾家存冒雨看禾黍逢人憶子孫亂藤穿井口流水到籬根惆悵不堪住空山月又昏落第後歸終南别業久為名所誤春盡始歸山落羽羞言命逢人強破顔交疏貧病裏身老是非間不及東溪月漁翁夜往還送從舅成都丞廣南歸蜀巴字天邊永秦人去是歸棧長山雨響溪亂火田稀俗富行應樂官雄祿豈微魏舒終有淚還濕寧家衣晚次鄂州至德中作雲開逺見漢陽城猶是孤帆一日程估客晝眠知浪靜舟人夜語覺潮生三湘愁鬢逢秋色萬里歸心對月明舊業已隨征戰盡更堪江上鼓鼙聲酬暢當嵩山尋道士見寄間逐樵夫行看棊忽逢人世是秦時開雲種玉嫌山淺渡海傳書怪鶴遲隂洞石幢微有字古壇松樹半無枝煩君逺示青囊籙願得相從一問師司空曙二十五首字文明貞元中為尚書水部郎中過寶慶寺黃葉前朝寺無僧寒殿開池晴龜出曝松暮鶴飛回古井碑橫草隂廊畫雜苔禪宫亦銷歇塵世轉堪哀送栁震歸蜀白日雙流靜西看蜀國春桐花能乳鳥竹節競祠神蹇步徒相望先鞭不可親知從江僕射登榻更何人送高勝重謁曹王江上青楓岸隂隂萬里春朝辭郢城酒暮見洞庭人興比乘舟訪恩懷倒屣親想君登舊榭重喜掃芳塵送流人聞説南中事悲君重竄身山村楓子鬼江廟石郎神童稚留荒宅圖書託故人青門好風景為爾一霑巾題陵雲寺春山古寺繞滄波石磴盤空鳥道過百丈金身開翠壁萬龕燈焰隔煙蘿雲生客到侵衣濕花落僧禪覆地多不與方袍同結社下歸塵世竟如何題江陵臨沙驛樓江天清更愁風栁入江樓雁惜楚山晚蟬知秦樹秋淒涼多獨醉零落半同遊豈復平生意蒼然蘭杜洲田家田家喜雨足鄰老相招攜泉溢溝塍壞麥高桑柘低呼兒催放犢宿客待烹雞搔首蓬門下知將軒冕齊送曲山人之衡州白石先生眉髮光已分甜雪飲紅漿衣巾半染煙霞氣語笑兼和藥草香茅洞玉聲流暗水衡山碧色映朝陽千年城郭如相問華表峩峩有夜霜立秋日律變新秋至蕭條自此初花酣蓮報謝葉在栁呈疏淡日非雲映清風似雨餘卷簾涼暗度迎扇暑先除草靜多翻燕波澄乍露魚今朝散騎省作賦興何如詠古寺花共愛芳菲此樹中千跗萬萼裹枝紅遲遲欲去猶回望覆地無人滿寺風送魏季羔長沙覲兄蘆荻湘江水蕭蕭萬里秋鶴高看迥野蟬逺入中流訪友多成滯還家不厭遊惠連有新作知得從兄酬送曹同椅青春三十餘衆藝盡無如中散詩傳畫將軍扇續書楚田晴下雁江日暖多魚惆悵空相送歡遊自此疏雲陽館與韓升卿宿别故人江海别幾度隔山川乍見翻疑夢相悲各問年孤燈寒照雨深竹暗浮煙更有明朝恨離杯惜共傳酬張芬有赦後見贈紫鳳朝銜五色書陽春忽布網羅除已將心變寒灰後豈料光生腐草餘建水風煙收客淚杜陵花竹夢郊居勞君故有詩人贈欲報瓊瑶恨不如哭苗員外呈張參軍苗公即參軍舅氏思君寧家宅久接竹林期嘗值偷琴處親聞比玉時高人不易合弱冠早相知試藝臨諸友能文即我師凌寒松未老先暮槿何衰季子生前别羊曇醉後悲壽堂乖一慟奠席阻長辭因瀝殊方淚遙成墓下詩金陵懷古輦路江楓暗宫庭野草春傷心庾開府老作北朝臣發渝州却寄韋判官紅燭津亭夜見君繁絃急管兩紛紛平明分手空江轉唯有猿聲滿水雲送盧徹之太原謁馬尚書榆落雕飛關塞秋黃雲畫角見并州翩翩羽騎雙旌後上客親隨郭細侯秋思呈尹植裴説鄭洞靜與懶相偶年將衰共催前途歡不集往事恨空來晝景委紅葉月華鋪緑苔沈思更何有坐結玉琴哀峽口送友人峽口花飛欲盡春天涯去住淚沾巾來時萬里同為客今日翻成送故人故郭婉儀挽歌一日辭秦鏡千秋别漢宫豈惟泉路掩長使月輪空苦色凝朝露悲聲切暝風婉儀餘舊德仍載禮經中送翰林張學士嶺南勒聖碑漢恩天外洽周頌日邊稱文獨司空羡書兼太尉能出關逢北雁度嶺逐南鵬使者翰林客餘春歸灞陵送吉校書東歸少年藝閣吏罷直暫歸休獨與親知别行逢江海秋聽猿看楚岫隨雁到吳洲處處園林好何人待子猷早春遊望東風春未足試望秦城曲青草狀寒蕪黃花似秋菊壯將歡共去老與悲相逐獨作遊社人暮過威輦宿秋日趨府上張大夫重城洞啓肅秋煙共説羊公在鎮年鞞鼓暗驚林葉落旌旗遙拂雁行偏石過橋下書曾受星降人間夢已傳謫吏何能沐風化空將歌頌拜車前唐百家詩選卷八
