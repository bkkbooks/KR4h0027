body:
  text: 唐百家詩選卷十宋王安石編皇甫冉下六十五首奉和徐州王相公彭祖井之作上公旌節在徐方舊井莓苔近寢堂訪古因知彭祖宅得仙何必葛洪鄉清虛不共春池競盥潄偏宜夏日長聞道延年如玉液欲將調鼎獻明光又和雪春雪偏當夜暄風却變寒庭深不復掃城曉更宜看命酒閒令酌披裘晚未冠連營鼓角動忽似戰桑乾送蕭處士惆悵煙郊晚依然此送君長河隔旅夢浮客伴孤雲淇上春山直黎陽大道分西陵儻一弔應有士衡文之京留别劉方平客子慕儔侣含悽整晨裝邀歡日不足况乃前期長離袂惜嘉月逺懷勞折芳遲遲越二陵回首但蒼茫喬木清宿雨故關愁夕陽人言長安樂其奈緬相望出塞吹角出塞門前瞻即胡地三軍盡回首皆灑望鄉淚轉念關山長行看風景異由來征戍客各負輕生義館陶李丞舊居盛名天下挹餘芳棄置終身不拜郎詞藻世傳平子賦園林人比鄭公鄉門前墜葉浮秋水籬外寒臯帶夕陽日日青松成古木祗應來者為心傷送劉兵曹還隴山居離堂徒宴語行子但悲辛雖是還家路終為上隴人先秋雪已滿近夏草初新唯有聞羌笛梅花曲裏春同裴少府安居寺對雨共結尋真會還當退食初爐煙雲氣合林葉雨聲餘溽暑銷珍簟浮涼入綺疏歸心從念逺懷此復何如贈鄭山人白首滄洲客陶然得此生龎公採藥去萊氏與妻行乍見還州里全非隱姓名枉帆臨海嶠貰酒秣陵城伐木吳山曉持竿越水清家人忘貧賤物外任衰榮忽爾辭林壑高歌至上京避喧心已慣念逺夢頻成石路寒花發江田臘雪明𤣥纁儻有命何以遂躬耕寄劉八山中東臯若近逺苦雨隔還期閏歲風霜晚山田收穫遲茅簷燕去後樵路菊黃時平子遊都久知君坐見嗤雜言無錫惠山寺流泉歌寺有泉兮泉在山鏘金鳴玉兮長潺潺作潭鏡兮澄寺內泛巖花兮到人間土膏脈動知春早隈隩隂深長苔草處處縈回石磴喧朝朝盥潄山僧老林松自古草自新清流活活無冬春任疏鑿兮與汲引若有意兮山中人偏依佛界通仙境明滅玲瓏媚林嶺宛如太室臨九潭詎減天台望三井我來結綬未經秋已厭微官憶舊遊且復遲回猶未去此心只為靈泉留田家作臥見高原燒閒尋空谷泉土膏消臘後麥隴發春前藥驗桐君録心齊莊子篇荒村三數處衰栁百餘年好就山僧去時過野舍眠汲流寧厭逺卜地本求偏向子諳樵路陶家置黍田雪峰明晚景風雁急寒天且復冠名鶡寧知冕戴蟬問津夫子倦荷蓧丈人賢顧物皆從爾求心正儻然嵇康懶慢性祗自戀風煙寄劉方平十年不出蹊林中一朝結束甘從戎嚴子持竿心寂歷寥落荒籬遮舊宅終日碧湍聲自喧暮秋黃菊花誰摘每望南峰如對君昨來不見多寒雲石徑幽人何所在玉泉疏鐘時獨聞與君從來同語默豈是悠悠但相識天畔三秋空復情袖中一字無由得世人易合復易離故交棄置求新知歎息青青長不改歲寒霜雪貞松枝溫湯即事天仗星辰轉霜冬景氣和樹含溫液潤山入繚垣多丞相金錢賜平陽玉輦過魯人求一謁無路獨如何送張南史效何記室體馬卿工詞賦位下年將暮謝客愛雲山家貧身不閒風波杳未極幾處逢相識富貴人更變誰能念貧賤岸有經霜草林有故年枝俱應待春色獨使客心悲送孔巢父赴河南軍得河字江城相送阻煙波况復新秋一雁過聞道全師征北虜更言諸將會南河邊心杳杳鄉人絶塞草青青戰馬多共許陳琳工奏記知君名宦未蹉跎和元中丞奉使承恩還終南舊居軒車尋舊隱賓從滿郊園蕭散煙霞興殷勤故老言謝公山不改陶令菊猶存苔蘚侵垂釣松篁長閉門風霜清吏事江海諭君恩祗召趨宣室沈冥在一論酬李司兵直夜見寄江城聞鼓角旅宿復何如寒月清宵半春風舊歲餘徒云資薄祿未必勝閒居見欲扁舟去誰能畏簡書送薛判官之越時艱自多務職小亦求賢道路無辭逺雲山併在前樟亭待潮處已是越人煙同溫丹徒登萬歲樓高樓獨上思依依極浦遙山合翠微江客不堪頻北望塞鴻何事復南飛丹陽古渡寒煙積瓜步空洲逺樹稀聞道王師猶轉戰誰能談笑解重圍送鄒判官赴河南看君發原隰四牡去皇皇始罷滄江吏還隨粉署郎海圻軍未息河畔歲仍荒征稅人全少榛蕪虜近亡所行知宋逺相隔嘆淮長早晚裁書寄銀鈎佇八行宿淮隂南樓酬常伯熊淮隂日落上南樓喬木荒城古渡頭浦外野風初入户窗中海月早知秋滄波一望通千里畫角三聲起百憂獨立宵分逺來客煩君步屐忽相求小江懷靈一上人六言江上年年春早津頭日日人行借問山隂逺近猶聞薄暮鐘聲送唐别駕赴郢州莫歎辭家逺方看佐郡榮長林通楚塞高嶺見秦城雪向嶢關下人從郢路迎翩翩駿馬去自是少年行酬李補闕十年歸客但心傷三徑無人已自荒夕宿靈臺伴煙月晨趨建禮逐衣裳久因麋鹿隨豐草謬荷鵷鸞借末行縱有諫書猶未獻春風拂地日空長同韓給事觀畢給事畫松石入聲海嶠微茫那得到楚關迢遞心空憶夕郎善畫巖間松逺意幽姿此何極千條萬葉紛異狀虎伏螭盤爭徑力扶疏半映晚天青凝淡全和曙雲黑煙籠月照安可道雨濕風吹未曾息能將積雪辨晴光每與連峰作寒色龍樓不競繁花吐騎省偏宜遙夜直羅浮道士訪移來少室山僧舊應識掖垣深沉晝無事終日亭亭在人側古槐衰栁寧足論還對罘罳列行植送令狐明府行當臘候晚共惜歲隂殘聞道巴山逺如何蜀路難荒林藏積雪亂石起驚湍君有親人術應令勞者安送從姪栖間律師能知出世法詎有在家心南院開門送東山策杖尋經年期故里及夏到空林念逺長勞望朝朝草色深舟中送李觀江南近别亦依依山晚川長客伴稀獨坐相思計行日出門臨水望君歸故齊王贈承天皇帝挽歌禮盛追崇日人知友悌恩舊居從代邸新壠入文園鴻寶仙書祕龍旗帝服尊蒼蒼松裏月萬古此高原贈恭順皇后挽歌徂謝年方久哀榮事獨稀雖殊百兩迓同是九泉歸詔使傳金冊神人送玉衣空山竟不從寧肯學湘妃送太常大夫加散騎常侍赴朔方故壘煙塵促新軍河塞間金貂寵漢將玉節度蕭關散漫沙中雪依稀漠口山人知竇車騎計日勒銘還送王翁信還剡中舊居海岸耕殘雪溪沙釣夕陽家中何所有春草漸看長奉寄皇甫補闕張繼作附此京口情人别久揚州估客來疏潮至潯陽回去相思無處通書酬張繼并序懿孫余之舊好祗役武昌有六言詩見懷今以七言裁答蓋拙於事者繁而費悵望南徐登北固迢迢西塞限東關落日臨川問音信寒潮唯帶夕陽還送栁八員外赴江西岐路無窮極長江九派分行人隨旅雁楚樹入湘雲久在征南役何殊薊北勳離心不可問歲暮雪紛紛送陸邃潛夫并序頃者江淮征鎮屢有掄才之舉子不列焉有司之過子方耕山釣湖避人如逃寇徒欲羅高鴻捕深魚窮年竭日甚不可得也今齒髮向暮執勞無力衆雛嗷嗷開口待哺如有知者子其行乎無為自苦高山迥欲登逺水深難渡杳杳復漫漫行人别家去又得雲字何事千年遇聖君坐令雙鬢老如雲南行更入山深淺岐路悠悠水自分又送陸潛夫延陵尋友登山自補屐訪友不齎糧坐歇青楓晚行吟白日長人煙隔水見草氣入林香誰作招尋侣清齊宿紫陽送鄭二堪之茅山六言水流絶澗終日草長深山暮春犬吠雞鳴幾處條桑種杏何人問李二司直所居雲山門外水流何處天邊樹繞誰家山色東西多少朝朝幾度雲遮閒居作多病辭官罷閒居作賦成圖書唯藥籙飲食止藜羮學謝淹中術詩無鄴下名不堪趨建禮詎是厭承明已輟金門步方從石路行逺山期道士高栁覔先生性懶尤因疾家貧自少營種苗雖尚短榖價幸全輕篇詠投康樂壺觴就步兵何人肯相訪開户一逢迎和王給事禁省梨花巧解近人笑還能亂蝶飛春風時入户幾片落朝衣歸渡洛水暝色赴春愁歸人南渡頭渚煙空翠合灘月碎光流澧浦饒芳草滄浪有釣舟誰知放歌客此意正悠悠送陸澧郭鄖才見吳洲百草春已聞燕雁一聲新秋風何處催年急偏逐山行水宿人重陽日酬李觀不見白衣來送酒但令黃菊自開花愁看日晚良辰過步步行尋陶令家送蔣評事往福州江上春常早閩中客去稀登山怨迢遰臨水惜芳菲煙樹何時盡風帆幾日歸還看復命處盛府有光輝送從弟豫貶袁州何事成遷客思歸不見鄉遊吳經萬里弔屈過三湘水與荆巫接山通鄢郢長名嗟黃綬繫身是白眉良獨結南枝恨應思北雁行憂來沽楚酒𤣥鬢莫凝霜送錢塘路少府赴制舉公車待詔赴長安客裏新正阻舊歡遲日未能銷野雪晴花偏自犯江寒東溟道路通秦塞北闕威儀覩漢官共許郤詵工射策恩榮請向一枝看賦得荆溪夜湍送蔣逸人歸義興山驚湍流不極夜度識雲岑長帶溪沙淺時因山雨深方同七里路更遂五湖心揭厲朝將夕潺湲古至今花源若許到雖逺亦相尋送孔黨赴舉入貢列諸生詩書業早成家承孔聖後身有魯儒名楚水通滎浦秦山擁漢京愛君方弱冠為賦少年行送裴陟歸常州夜雨須停棹秋風暗入衣見君常北望何事却南歸徐州送丘侍御之越時鳥催春色離人惜歲華逺山隨擁傳芳草引還家北固潮當闊西陵路稍斜縱令寒食過猶有鏡中花送韋山人歸所居鍾山逸人歸路逺弟子出山迎服藥顔須駐耽書癖已成柴扉度歲月藜杖見公卿更作儒林傳還應有姓名和袁郎中破賊後經剡中山水同用溪字武庫分帷幄儒衣事鼓鼙兵連越徼外寇盡海門西節比全疏勒功當雪會稽旌旗回剡嶺士馬濯耶溪受律梅初發班師草未齊行看佩金印豈得訪丹梯送處州裴使君赴京使君朝北闕車馬發東方别喜天書召寧愁地脈長山行朝復夕水宿露為霜秋草連秦塞孤帆落漢陽新銜趨建禮舊位識文昌唯有聨翩翼翻隨南雁翔送包佶賦得天津橋洛橋歲暮作征客闕相望依然一水間相思已如千里隔晴煙霽景滿天津鳳闕龍樓映水濱豈無朝夕軒車度其奈相逢非所親鞏樹甘陵愁逺道他鄉一望人堪老君報還期在早春橋邊日日看芳草宿嚴維宅送包七江湖同避地分手自依依盡室今為客經秋空念歸歲儲無别墅寒服羡鄰機草色村橋晚蟬聲江樹稀夜凉宜共醉時難惜相違何事隨陽侣汀洲忽背飛送延陵陳法師赴上元延陵初罷講建業去隨緣翻譯推多學壇場最少年浣衣逢野水乞食向人煙遍禮南朝寺焚香古像前賦得海邊樹歷歷緣荒岸冥冥入逺天每同沙草發長共水雲聨搖落潮風早離披海雨偏故傷遊子意多在客舟前題昭上人房沃洲傳教後百衲老空林慮盡朝昏磬禪隨坐臥心鶴飛湖草逈門閉野雲深地與天台接中峰早晚尋寄韋司直前郎士元有此詩未知孰是聞君感歎二毛初舊友相依萬里餘烽戍有時驚暫定甲兵無處可安居客來吳地星霜久家在平陵音信疏昨夜春風還入户登山臨水復何如送魏十六還蘇州秋夜沈沈此送君隂蟲切切不堪聞歸舟明日毗陵道回首姑蘇是白雲婕妤怨由來詠團扇今已值秋風事逐時偕往恩無日再中早鴻聞上苑寒露下深宫顔色年年謝相如賦豈工送客旗鼓軍威重關山客路賒待封甘度隴回首不思家城下春山路營中瀚海沙河源雖萬里音信寄來查唐百家詩選卷十
