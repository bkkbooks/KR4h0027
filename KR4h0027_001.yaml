body:
  text: 唐百家詩選卷一宋王安石編明皇二首早渡蒲關鐘鼓嚴更曙山河野望通鳴鑾下蒲坂飛斾入秦中地險關逾壯天平鎮尚雄春來津樹合月落戍樓空馬色分朝景雞聲逐曉風所希常道泰非復俟繻同經魯祭孔子而歎之夫子何為者栖栖一代中地猶鄒氏邑宅即魯王宫歎鳯嗟身否傷麟怨道窮今看兩楹奠當與夢時同德宗一首送徐州張建封還鎮牧守寄所重才賢生為時宣風自淮甸授鉞膺藩維入覲展遐戀臨軒慰來思忠誠在方寸感激陳情詞報國爾所向恤人豫是資歡宴不盡懷車馬當還期穀雨將應候行春猶未遲勿以千里遙而云無已知薛稷一首秋日還京陜西十里作驅車越陜郊北顧臨大河隔河見鄉邑秋風水增波西登咸陽途日暮憂思多傅巖既紆鬱首山亦嵯峨操築無昔老採薇有遺歌客遊節回換人生知幾何劉希夷九首希夷字庭芝武后時人故園置酒酒熟人須飲春還鬢已秋願逢千日醉得緩百年憂舊里多青草新知盡白頭風前燈易滅川上月難留卒卒周姬旦棲棲魯孔丘平生能幾日不及且遨遊晚憩南陽旅館旅館何年廢征夫此日過途窮人自哭春至鳥還歌行路新知少荒田古路多池篁覆丹谷墳樹繞清波日照蓬隂轉風微野氣和傷心不可去回首怨如何採桑楊栁送行人青青西入秦誰家採桑女樓上不勝春盈盈灞水曲步步春芳緑紅臉曜明珠絳唇含白玉回首渭橋東遙憐樹色同叉梳映落日緗綺弄春風攜籠長歎息逶迤戀春色看花若有情倚樹疑無力薄暮思悠悠使君南陌頭相逢不相識歸去夢青樓代閨人春日珠簾的曉光玉顔豔春彩林間鳥鳴喚户外花相待花鳥惜芳菲鳥鳴花亂飛人今伴花鳥日暮不能歸池月憐歌扇山雲愛舞衣佳期楊栁陌攜手莫相違秋日題汝陽潭壁獨坐秋隂至悲來從所適行見汝陽潭飛蘿蒙水石懸瓢木葉上風吹何歷歷幽人不耐煩振衣步間寂回流清見底金沙覆銀礫錯落非一丈空朧幾千尺魚鱗可憐紫鴨毛自然碧吟詠秋水篇渺焉忘損益秋水隨形影清濁混心迹嵗暮歸去來東山余宿昔代悲白頭翁洛陽城東桃李花飛來飛去落誰家洛陽女兒惜顔色行逢落花長歎息今年花落顔色改明年花開復誰在已見松柏摧為薪更聞桑田變成海古人無復洛城東今人還對落花風年年嵗嵗花相似嵗嵗年年人不同寄言全盛紅顔子須憐半死白頭翁此翁白頭真可憐伊昔紅顔美少年公子王孫芳樹下清歌妙舞落花前光祿池臺開錦繡將軍樓閣畫神仙一朝卧病無人識三春行樂在誰邊宛轉蛾眉能幾時須臾鶴髮亂如絲但看舊來歌舞地唯有黃昏鳥雀悲巫山懷古巫山幽隂地神女豔陽年襄王伺容色落日望悠然歸來髙堂夜金缸𦦨青煙頽想卧瑶席夢魂何翩翩搖落殊未已榮華倐徂遷愁思瀟湘浦悲涼雲夢田猿啼秋風夜雁飛明月天巴歌不可聽聽此益潺湲春女行春女顔如玉怨歌陽春曲巫山春樹紅沅湘春草緑自憐妖豔姿糚成獨見時愁心伴楊栁春盡亂如絲目極千餘里悠悠春江水頽想玉關人愁臥金閨裏尚言春花落不知秋風起嬌愛猶未終悲涼從此始憶昔楚王宫玉樓籹粉紅纖腰弄明月長袖舞春風容華委西山光隂不可還桑林沒東海富貴今何在寄言桃李容胡為閨閣重但看楚王墓唯見數株松孤松篇蠶月桑葉青鶯時栁花白淡豔煙雨滋敷芬陽春陌如何秋風起零落從此始獨有南澗松不歎東流水玄隂天地冥皓雪朝夜零豈不罹寒暑為君留青青青青好顔色落落任孤直羣樹遙相望衆草不敢逼靈龜卜真隱仙鳥宜棲息恥受秦帝封願言唐侯食寒山夜月明山冷氣清清凄兮歸風集吹之作琴聲松子卧仙岑寂聽凝野心清泠有真曲樵採無知音美人何時來幽徑委緑苔吁嗟深澗底棄捐廣厦材王適一首詠江濱梅忽見寒梅樹開花漢水濱不知春色早疑是弄珠人韋述一首晚渡伊水悠悠涉伊水伊水清見石是時春向深兩岸草如積迢遞望洲嶼逶迤亘津陌新樹落疏紅遙原上深碧回瞻洛陽苑遽有長山隔煙霧猶辨家風塵已為客登陟多異趨往來見行役雲起早已昏鳥飛日將夕光隂逝不借超然慕疇昔逺遊亦何為歸來存竹帛盧象十首開元天寶時人雜詩二首家居五原上征戰是平生獨負山西勇誰當塞上名死生遼海戰雨雪薊門行諸將封侯盡論功獨不成君家御溝上垂栁夾朱門列鼎會中貴鳴珂朝至尊死生在片議窮達由一言須識苦寒士莫矜狐白溫八月十五日象自江東止田園移莊慶會未幾歸汶上小弟幼妹尤悲其别兼賦是詩謝病始告歸依然入桑梓家人皆佇立相候衡門裏疇類皆長年成人舊童子上堂家慶畢願與親姻邇論舊或餘悲思存且相喜田園轉蕪沒但有寒泉水衰栁日蕭條秋光清邑里入門乍如客休騎非便止中飲顧王程離憂從此始兩妹日成長雙鬟將及人已能持寶瑟自解掩羅巾念昔别時小未知疏與親今來識離恨掩淚方殷勤小弟更孩幼歸來不相識同居雖漸慣見人猶默默宛作越人言殊鄉甘水食别此最為難淚盡有餘憶寄江上段十六與君相識即相親聞道君家住孟津為見行舟試借問客中時有洛陽人贈劉藍田籬中犬迎吠出屋候柴扉嵗晏輸井稅山村人暮歸晚田始家食餘布成我衣對此能無事勞君問是非白髮我年一何長鬢髮日已白俯仰天地間能為幾時客惆悵故山雲徘徊空日夕何事與時人東城復南陌鄉賦後自鞏還田家因謝鄰友見過之作雞鳴出東邑馬倦登南巒落日見桑柘翳然丘中寒鄰家多舊識投暝來相看且問春稅苦兼陳行路難園場近隂壑草木皆凋殘峰暗雪猶積澗深冰已團浮名知何用嵗晏不成歡置酒共君飲當歌聊自寬竹里館江南冰不閉山澤氣潛通臘月聞山鳥寒崖見蟄熊栁林青半合荻筍亂無叢回首金陵岸依依向北風和徐侍郎叢篠詠中禁夕沈沈幽篁别作林色連雞樹近影落鳯池深為重凌霜節能虛應物心年年承雨露長對紫庭隂宴别趙都護結客候旌麾元戎復在斯門開都護府兵動羽林兒黠虜多翻覆謀臣有别離智同天所授恩共日相隨漢使開賓幕胡笳送酒巵風霜迎馬首雨雪事魚麗上䇿應無戰深情屬載馳不應行萬里明主寄安危孟浩然三十三首字浩然襄陽人開元天寶間以詩聞於時不仕卒年五十二湘中旅泊寄閻九司户防桂水通百越扁舟期曉發荆雲蔽三巴夕望不見家襄王夢行雨才子謫長沙長沙饒瘴癘胡為苦留滯久别思欵顔承歡懷接袂接袂杳無由徒增旅泊愁清猿不可聽沿月下湘流嵗暮歸南山北闕休上書南山歸敝廬不才明主棄多病故人疏白髮催年老青陽逼嵗除永懷愁不寐松月夜窗虛陪張丞相自松滋江入舟東泊渚宫作放溜下松滋登舟命楫師詎忘經濟日不憚沍寒時洗幘豈獨古濯纓良在兹政成人自理機息鳥無疑雲氣霾孤嶼江天辨四維晚來風稍急冬至日行遲獵響驚雲夢漁歌激楚詞渚宫何處是川暝欲安之嵗暮海上作仲尼既已歿豫亦浮於海昏見斗柄回始知嵗星改虛舟任所適垂釣非有待借問乘槎人滄洲復誰在自洛之越皇皇三十載書劒兩無成山水尋吳越風塵厭洛京扁舟泛湖海長揖謝公卿且樂杯中酒誰論世上名王山人迥見尋歸間日無事雲卧晝不起有客欵柴扉自云巢居子問君何所之採藥來城市家在鹿門山常遊澗湖水手持白羽扇腳踏青芒履聞道鶴書徵臨流還洗耳遊精思觀回王山人在後出谷未停午至家已夕曛回瞻下山路但見牛羊羣樵子暗相失草蟲寒不聞衡門猶未掩佇立待夫君夜泊宣城界西塞沿江島南陵問驛樓湖平津濟濶風止客帆收去去懷前浦茫茫泛夕流石逢羅剎礙山泊敬亭幽火熾梅根冶煙迷楊葉洲離家復水宿相伴賴沙鷗永嘉上浦館逢張八子容逆旅相逢處江村日暮時衆山遙對酒孤嶼共題詩廨宇鄰鮫室人煙接島夷鄉關萬餘里失路一相悲宿業師山房期丁鳯進士不至夕陽度西嶺羣壑倐已瞑松月生夜涼風泉滿清聽樵人歸欲盡煙鳥棲初定之子期宿來攜琴候蘿徑夕次蔡陽館日暮馬行疾荒城人住稀聽歌知近楚投館忽如歸魯堰田疇廣章陵氣色微明朝拜家慶須著老萊衣過故人莊故人具雞黍邀我至田家緑樹村邊合青山郭外斜開筵面場圃把酒話桑麻待到重陽日還來就菊花登鹿門山懷古清曉因興來乘流越江峴沙禽近初識浦樹遙莫辨漸到鹿門山山明翠微淺嵓潭多屈曲舟楫屢回轉昔聞龎德公采藥遂不返金澗養芝术石床卧苔蘚紛吾感耆舊結攬事攀踐隱迹今尚存髙風邈已逺白雲何時去丹桂空偃蹇探討竟未窮回艫夕陽晚裴司功貟司士見尋府僚能枉駕家醖復新開落日池上酌清風松下來厨人具雞黍稚子摘楊梅誰道山公醉猶能騎馬回送杜晃進士之東吳荆吳相接水為鄉君去春江正渺茫日暮征帆泊何處天涯一望斷人腸登江中孤嶼貽王山人迥悠悠清江水水落沙嶼出回潭石下深緑篠岸傍密鮫人潛不見漁父歌自逸憶與君别時泛舟如昨日夕陽開返照中坐興非一南望鹿門山歸來恨相失晚泊潯陽望廬峰作挂席幾千里名山都未逢泊舟潯陽郭始見香爐峰嘗讀逺公傳永懷塵外蹤東林精舍在日暮但聞鐘同張明府清鏡歎妾有盤龍鏡清光常晝發自從生塵埃有若霧中月愁來試取照坐歎生白髮寄語邊塞人如何久離别宿終南翠微寺空上人房翠微終南裏雨後宜返照閉關久沉冥杖䇿一遊眺遂造幽人室始知靜者妙儒道雖異門雲林頗同調兩心喜相得畢景共談笑暝還髙窗眠時見逺山燒緬懷赤城標更憶臨海嶠風泉有清音何必蘇門嘯送友人之京君登青雲去豫望青山歸雲山從此别淚濕薜蘿衣京還留别新豐諸官吾道懵所適驅車還向東主人開舊館留客醉新豐樹繞溫泉緑塵昏晚日紅拂衣從此去髙步躡華嵩江上别流人以我越鄉客逢君謫居者分飛黃鶴樓流落蒼梧野驛騎尋雲去孤帆沿溜下不知從此分還𬒮何時把上巳日洛中寄王山人迥卜洛成周地浮杯上已筵鬬雞寒食下走馬射堂前垂栁金堤合平沙翠幕連不知王逸少何處會羣賢秋登萬山寄張五儃北山白雲裏隱者自怡悅相望試登髙心隨鳥飛滅愁因薄暮起興是清秋發時見歸村人沙平渡頭歇天邊樹若薺江畔洲如月何當載酒來共醉重陽節夜歸鹿門寺歌山寺鳴鐘晝已昏漁梁渡頭爭渡喧人隨沙路向江村豫亦乘舟歸鹿門鹿門月照開煙樹忽到龎公棲隱處嵓扉松徑長寂寥唯有幽人夜來去與諸子登峴山作人事有代謝往來成古今江山留勝迹我輩復登臨水落漁梁淺天寒夢澤深羊公碑尚在讀罷淚沾襟赴京途中遇雪迢遞秦京道蒼茫嵗暮天窮隂連晦朔積雪滿山川落雁迷沙渚飢烏噪野田客愁空佇立不見有人煙宿建德江移舟泊滄渚日暮客愁新野曠天低樹江清月近人萬山潭作垂釣坐磐石水清心自間魚遊潭樹下猿挂島藤間神女昔解珮傳聞於此山求之不可得沿月棹歌還春中喜王九相尋二月湖水清家家春鳥鳴林花掃更落徑草踏還生酒伴來相命開尊共解酲當杯已入手歌妓莫停聲途中遇晴已失巴陵雨猶逢蜀坂泥天開斜景遍山出晚雲低餘濕仍霑草殘流尚入溪今宵有明月鄉思逺悽悽送從弟雍落第東遊會稽疾風吹征帆倐爾向空沒千里去俄頃三江坐超忽向來共歡娛日夕成楚越落羽更分飛誰能不驚骨和張丞相春朝對雪迎氣當春立承恩喜雪來潤從河漢下花逼豔陽開不覩豐年瑞安知燮理才撒鹽如可擬願糝和羮梅唐百家詩選卷一
