body:
  text: 唐百家詩選卷十二宋王安石編楊巨源四十六首送太和公主和蕃北路古來難年光獨認寒朔雲侵鬢起邉月向眉殘蘆井尋沙到花門度磧看薰風一萬里來處是長安春日奉獻聖壽無疆詞代是文明晝春當燕喜時爐烟添柳重宫漏出花遲漢典方寬律周官正採詩碧霄傳鳯吹紅旭在龍旗造化膺神契陽和沃聖慈無因隨百獸率舞奏丹墀贈鄰家老將白首羽林郎丁年戍朔方隂天瞻磧路秋日渡遼陽大漠寒山黑孤城夜月黃十年依蓐食萬里帶金瘡拂雪陳師祭衝風立教場箭飛瓊羽合旗動火雲張虎翼分營勢魚鱗擁陳行誓心清塞色鬭血雜沙光戰地晴暉薄軍門曉氣長冦深爭暗襲關迥勒春防身賤竟何訴天髙徒自傷功成封寵將力盡到貧鄉雀老方悲海鷹衰却念霜空餘孤劍在開匣一霑裳和練師索秀才楊柳水邉楊柳緑烟絲立馬煩君折一枝惟有春風最相惜殷勤更向手中吹大堤詞二八嬋娟大堤女開壚相對依江渚待客登樓向水看邀郎卷幔臨花語細雨濛濛濕芰荷巴東商侣住帆多自傳芳酒翻紅袖誰調妍妝回翠蛾珍簟華燈夕陽後當罏理瑟矜纎手月落星微五鼓聲春風搖蕩忩前栁嵗嵗逢迎沙岸間背人多整緑雲鬟無端嫁與五陵少離别烟波傷玉顔聖恩洗雪鎮州寄獻裴相公天借春光洗緑林戰塵收盡見花隂好生本是君王德忍死何妨壯士心曽賀截雲翻柵逺仍聞斸凍下營深井陘昨日雙旗入蕭相無言淚濕襟上劉侍中命代生申甫承家翊禹湯廟謨膺間氣師律動清霜鍾鼎勳庸大河山誡誓長英姿凌虎視逸步壓龍驤道協陶鈞力恩回日月光一言𢎞社稷九命備圭璋政洽軍逾肅仁敷物已康朱門重棨㦸丹詔半縑緗位總興龍野師臨涿鹿鄉射鵰天更碧吹角塞仍黃深入平夷落橫行闢漢疆功垂貞石逺名映色絲香度磧瞻貔武臨池識鳯凰舞腰凝綺榭歌響拂雕梁杯淨傳鸚鵡裘鮮照鷫鸘吟詩白羽扇校獵緑沉槍風景佳人地烟沙壯士場幕中邀謝監麾下得周郎珠影含空徹瓊枝映坐芳王渾知武子陳實奬元方富貴春無限歡娛夜未央管絃隨玉帳樽俎奉金章俗理寧因勸邊城詎假防軍容雄朔漠公望冠巖廊分野鄰孤島京坻溢萬箱曙華分碣石秋色入漁陽城逺迷𤣥莵川明辨白狼忠賢多感激今古共蒼茫堤擁紅蕖艷橋分翠柳行軒車紛自至亭館鬱相當珍簟回煩暑層軒引早凉聽琴知思靜說劍覺神揚佳景燕臺上清暉鄭驛傍鼓鍾喧北里圭玉映東牀敢衒由之瑟甘循賜也牆官微思假路戰勝望升堂欲奮三年翼頻回一夕腸消憂期酒聖乘興任詩狂海內分桃李天涯剪稻粱升沉門下客誰道在蒼蒼郊居秋日酬奚贊府見寄繁菊照深居芳香春不如聞尋周處士知伴庾尚書日晚汀洲曠天晴草木疏閒言揮麈柄清步掩蝸廬野老能親牧髙人念逺漁幽叢臨古岸輕葉度寒渠暮色無狂蝶秋華有嫩蔬若為酬郢曲從此愧璠璵上裴中丞六年西掖宏湯誥三捷東堂總漢科政引風霜成物色語回天地到陽和清威更助朝端重聖澤曽隨筆下多應笑白鬚揚執㦸可憐春日老如何送裴中丞出使一清淮甸假朝綱金印初迎細柳黃辭闕天威和雨露出關春色避風霜龍韜何必陳三略虎旅由來肅萬方宣諭生靈真重任回軒應問石渠郎酬崔駙馬惠箋紙百張兼貽四韻百張雲樣亂花開七字文頭艷錦回浮碧定從天上得殷紅應自日邊來捧持價重欺雲葉封裹香深笑海苔滿篋清光應照眼欲題凡韻輒徘徊送司徒童子衛多君子魯多儒七嵗聞天笑舞雩光彩春風初轉蕙性靈秋水不藏珠兩經在口知名小百拜垂髫禀氣殊况復元侯旌爾善桂林枝上得鵷雛元日含元殿下立仗丹鳯樓下宣赦上門下相公二首天垂台耀拂欃槍壽獻山青祝聖明丹鳯闕前歌九奏金雞竿上鼓千聲衣裳南靣薰香動文字東方喜氣生從此登封資廟略兩河連海一時清臨軒啓扇似雲收率土朝天劇水流瑞色含春當正殿香烟捧日在髙樓三朝起草迎恩澤萬嵗長聲繞冕旒請問漢家功第一麒麟閣上識酇侯賀田僕射子弟榮拜金吾五侯恩澤不同年叔姪朱門䂍矟連鳯沼九重相喜氣鴈行一半入祥烟街衢燭影侵寒月文武珂聲疊曉天為數麒麟髙閣上誰家父子勒燕然觀打毬親掃毬場如砥平龍驤驟馬曉光晴入門百拜瞻雄勢動地三軍唱好聲玉勒回時霑赤汗花騣凶鬯匕分處拂紅纓欲令四海氛烟淨杖底纎塵不敢生送人過衛州憶昔征南府內遊君家東閣最淹留縱橫聨句長侵曉次第看花直到秋論舊舉杯先下淚傷離臨水更登樓相思前路幾回首滿眼青山過衛州贈李傅知因公望掩能文誓激明誠在致君曽罷雙旌瞻白日猶將一劍許黃雲搖窗竹色留僧語入院松聲共鶴聞莫被此心生晚計鎮南人憶杜將軍送綘州盧使君應將清靜結心期又共陽和到郡時綘老問年須算字庾公逢月要題詩朱欄迢遞因髙勝粉蝶清明欲下遲他日徵還作霖雨不須求賽敬亭祠和裴舍人觀田尚書出獵聖代司空比玉清雄藩觀獵見皇情雲禽已覺髙無益霜兔應知狡不成飛鞚擁塵寒草盡彎弓開月朔風生今朝始賀將軍貴紫禁詩人看斾旌送李舍人歸蘭陵里清詞舉世皆藏篋美酒當山為滿樽三畝嫩蔬臨綺陌四行髙樹擁朱門家貧境勝心無纍名重官閒口不論惟有道情常自足啓期天地易知恩和人與人分惠賜氷天水藏來玉墮空先頒密署幾人同映盤皎潔非關露當扇清涼不在風瑩質方從綸閣內凝輝更借錦帷中麗詞珍貺難雙有迢遞金鑾殿角東寄中書同年舍人晴明紫閣最髙峰仙掖開簾范彥龍五色天書詞煥爛九華春殿語從容綵毫應染爐烟細清佩仍含玉漏重二十年前同日喜碧霄何路得相逢早春即事呈劉員外明朝晴暖即相隨肯信春光被雨欺且任文書堆案上免令杯酒負花時馬蹄經歷應須遍鶯語丁寧已怪遲更待雜芳成豔錦鄴中爭唱仲宣詩酬于駙馬二首綺陌塵香曙色分碧山如畫又逢君蛟藏秋月一片水驥鎖晴空千尺雲戚里舊知何駙馬詩家今得鮑參軍陽和本是煙霄曲須向花間次苐聞芳時碧落心應斷今日清詞事不同瑶草秋殘仙圃在綵雲天逺鳯樓空晴花曽送金羈影涼葉還生玉簟風長得聞詩歡自足㑹看春露濕蘭叢和侯大夫秋原觀征人回兩河罷戰萬方清原上軍回識舊營立馬望雲秋塞淨射鵰臨水晚天晴戍閒部伍分岐路地逺家鄉寄斾旌聖代止戈資廟略諸侯不復更長征同太常尉遲博士闕下待漏沉沉延閣抱丹墀松色苔花皓露滋爽氣曉來青玉甃薰風宿在翠花旗方瞻御陌三條廣猶覺仙門一刻遲此地含香從白首馮唐何事怨明時見薛侍御戴不損裹帽子因贈潘郎對青鏡烏帽似新裁曉露鴉初洗春荷葉半開堪將護巾櫛不獨隔塵埃已見籠蟬翼無因映鹿胎何人呈巧思好手自西來有意憐衰醜煩君致一枚寄昭應王丞武皇金輅輾香塵每嵗朝元及此辰光動泉心初浴日氣蒸山腹總成春謳歌已入雲韶曲詞賦方歸侍從臣瑞靄朝朝猶望幸天教赤縣有詩人將歸東都别令狐舍人緑楊紅杏滿城春一騎悠悠萬井塵岐路未關今日事風光欲醉長年人閒過綺陌尋髙寺強到朱門謁近臣多病晚來還有䇿洛陽山色舊相親寄江州白司馬江州司馬平安否惠逺東林住得無湓浦曽聞似衣帶廬峰見說勝香爐題詩嵗晏離鴻斷望闕天遙病鶴孤莫謾勾牽雨花社青雲依舊是前途薛司空自青州歸朝天眷君陳久在東歸朝人看大司空黃河岸畔長無事滄海東邊獨有功已變畏途成雅俗仍過舊里揖清風一門纍葉凌烟閣次第儀形漢上公送章孝標校書歸杭州因寄白舍人曽過靈隱江邊寺獨宿東樓看海門潮色銀河鋪碧落日光金柱出紅盆不妨公事資髙卧無限詩情要細論若訪郡人徐孺子應須騎馬到沙村述舊紀勳寄太原李侍中光顔二首玉塞含悽見雁行北垣新詔拜龍驤弟兄間世真飛將貔虎歸時似故鄉鼓角因風飄朔氣旌旗映水發秋光河源收地心猶壯笑向天西萬里霜倚天長劍截雲孤報國縱橫見丈夫五載登壇真宰相六重分閫正司徒曽聞轉戰平堅冦共說題詩壓腐儒料敵知機在方寸不勞心力講隂符胡二十拜户部兼判度支清機果被公材撓雄拜知承聖主恩廟略已調天府實國征方覺地官尊徒言玉節將分閫定是沙隄欲到門為愛山前新卜第不妨風月事琴樽酬裴舍人見寄誰道重遷是舊班自將霄漢比鄉關二妃樓下宜臨水五老祠西好看山再葺吾廬心已足每來公府跡常閒詩陪亞相逾三紀石笥煙霞不共攀早朝鐘傳清禁才應徹漏報仙闈儼已開雙闕薄烟籠菡蓞九城初日照蓬萊朝時但向丹墀拜仗下方從碧落回聖代逍遙更何事願將巴曲贊康哉元日呈元逢吉舍人華夷文物賀新年霜仗遙排鳯闕前一片綵霞迎曙日萬條紅燭動春天稱觴山色和元氣端冕爐香疊瑞烟共說正初當聖澤試過西掖問羣賢酬盧員外話舊感往年相國河東張公宏靖常臨北府黍寮屬之末君有鄉里之親有作謝傅旌旄控上遊盧郎樽俎借前籌舜城風土臨清廟魏國山川在白樓雲寺當時接髙步水亭今日又同遊滿筵舊府笙歌在獨有羊曇最淚流述美寄申州盧拱使君領郡仍聞倅虎貔致身還是見男兒小船隔水催桃葉大鼓當風舞柘枝酒座微酣諸客倒毬場慢撥幾人隨從來樂事憎詩苦莫被窗中逺岫知贈張將軍關西諸將揖容光獨立營門劍有霜知愛魯連歸海上肯令王翦在頻陽天晴紅幟當山滿日暮清笳入塞長年少功髙人最美漢家壇樹月蒼蒼酬崔博士自知頑叟更何能唯學雕蟲謬見稱長被有情邀唱和近來無力更祗承青松樹杪千年鶴白玉壺中一片氷今日為君書壁右孤貞莫怕世人憎古意贈王常侍繡户紗窗北里深香風暗動鳯凰簪組紃長在佳人手刀尺空搖寒女心欲學齊謳逐雲管還思楚練拂霜砧東家少婦當機織應念無衣雪滿林和杜中丞西禪院看花一林堆錦映千燈照眼牽情欲不勝知倚晴明嬌自足解將顔色醉相仍好風輕引香烟入甘露才和粉艷凝深處最憐鶯蹂踐嫩時先被蝶侵凌對持真境應無取分付空門又未能迎日似翻紅燒斷臨流疑映綺霞層幽含晚態憐丹桂盛續春光識紫藤每到花枝獨惆悵山東惟有杜中丞王建上二十四首太和中為陜州司馬送人白日向西沒黃河復東流人生足著地寧免四方遊我行無返顧祝子勿回頭當須向前去何用起離憂但恐無廣路平地作山丘令我車與馬欲疾反停留蜀客多積貨邊人競封侯男兒戀家鄉歡樂為仇讐丁寧相勸勉苦口幸無尤對靣無相成不如豺虎儔彼逺不寄書此寒莫寄裘與君俱絶跡兩念無因由將歸故山留别杜侍御有川不得涉有路不得行沉沉百憂中一日如一生錯來干諸侯石田廢春耕虎㦸衛重門何因達中誠日月俱照曜山川異隂晴如何百里間開目不見明我今歸故山誓與草木並願君去丘坂長使道路平上七泉寺上方長年好名山本性今得從回看塵土遙稍見麋鹿蹤老僧雲中居石門青重重隂泉養成龜古壁飛却龍掃石禮新經懸幡上髙峰日夕猿鳥合覓食聽山鍾將火尋逺泉煮參傍寒松晚隨采藥人便宿南澗中晨起衝露行濕花枝茸茸歸依向禪師願作香火翁溫門山早入溫門山羣峰亂如㦸崩崖欲相觸呀豁斷行跡脫履尋淺流定足畏欹石路盡十里溪地多千嵗柏洞門晝隂黑深處惟石壁似見丹沙光亦聞鍾乳滴靈池出山底沸水衝地脉暖氣成濕烟濛濛窗中白隨僧入古寺便是雲外客月出天氣凉夜鍾山寂寂酬柏侍御聞與韋處士同遊靈臺寺見寄西域傳中說靈臺屬雍州有泉皆聖跡有石皆佛頭所出薝蔔香外國俗來求毒蛇護其下樵者不可偷古碑在雲顛備載置寺由魏家移下來後人始增修近與韋處士愛此山之幽各自具所須竹籠盛茶甌牽馬過危棧襞衣涉奔流草開平路盡林下大石稠回廊轉經峰忽見東西樓瀑布當寺門迸落衣裳秋石苔鋪紫花溪葉裁緑油松根載殿髙飄颻仙山浮縣中賢大夫一月前此遊賽神荷得雨豈暇多停留二十韻新詩逺寄尋山儔清令玉澗泣冷切石磬愁君名髙難間余身愚終休相將長無因從今生離憂送韋處士老舅憶昨癡小年不知有經籍常隨童子遊多向外家劇偷花入鄰里弄筆書墻壁照水學梳頭應門未穿幘人前賞文性梨果蒙不惜賦字詠新泉探題得幽石自從出關輔三十年作客風雨一飄颻親情多阻隔如何二千里塵土驅衰瘠良久陳辛苦從頭嘆衰白既來今又去暫笑還成戚落日動征車春風卷離席雲臺觀西路華嶽祠前柏㑹得過帝鄉重尋舊行跡邯鄲主人逺客無主人夜投邯鄲市飛蛾繞殘燭半夜人醉起壚邊酒家女遺我緗綺被合成雙鳯花宛轉不相離縱令顔色故勿遣合歡異一念始為難萬金誰足貴門前長安道去者如流水晨風羣鳥翔徘徊别離此泛水曲載酒入烟浦方舟泛緑波子酌我復飲子飲我還歌蓮深微路通峰曲幽氣多閲芳無留瞬弄桂不停柯水上秋日鮮西山碧峨峨兹歡良可貴誰復更來過題夀安南館明䝉竹間亭天暖幽桂碧雲生四靣山水接當階石濕樹浴鳥痕破苔卧鹿跡不緣塵駕觸堪作商皓宅江南新體二首江上風修修竹間湘水流日夜桂花落行人去悠悠復見離别處蟲聲隂雨秋處處江草緑行人發瀟湘瀟湘回雁多日夜思故鄉春夢不知數空山蘭蕙芳涼州行涼州四邊沙皓皓漢家無人開舊道邊頭州縣盡胡兵將軍别築防秋城萬里征人皆已沒年年旌節發西京多來中國收婦女一半生男為漢語蕃人舊日不耕犁相學如今種禾黍驅羊亦著錦為衣為惜氊裘防鬭時養蠶繅繭成匹帛那將繞帳作旌旗城頭山雞鳴角角洛陽家家教胡樂寒食行寒食家家出古城老人看屋少人行丘隴年年無舊道車徒散行入衰草牧童驅牛下冢頭畏有家人來灑掃逺人無墳水頭祭還引婦姑望鄉拜三日無火燒紙錢紙錢那得到黃泉但看壠上無新土此中白骨應無主促刺詞促促復刺刺水中無魚山無石少年雖嫁不將歸白頭猶著父母衣四邊田宅非所有我身不及逐雞飛出門若有歸死處猛虎當衢向前去百年不遣踏君門在家誰喚為新婦豈不見他鄰舍娘嫁來長在舅姑傍隴頭水隴水何年隴頭别不在山中亦嗚咽征人塞耳馬不行未到隴頭聞水聲謂是西流入蒲海還聞北去繞龍城隴東隴西多屈曲野麋飲水長蔟蔟胡兵夜回水傍住憶著來時磨劍處向前無井復無泉放馬回看隴頭樹北邙行北邙山頭少閒土盡是洛陽人舊墓舊墓人家歸葬多堆著黃金無買處天涯悠悠葬日促岡坂﨑嶇不停轂髙張素幕繞銘旌夜唱挽歌山下宿洛陽城北復城東魂車祖馬長相逢車轍廣若長安路蒿草多於松柏樹山頭澗底石漸稀盡向墳前作羊虎誰家石碑文字滅後人重取書年月朝朝車馬送葬回還起大宅與髙臺溫泉宫行十月一日天子來青繩御路無塵埃宮前內裏湯各别每箇白玉芙蓉開朝元閣向山上起城繞青山龍暖水夜開金殿看星河宫女知更月明裏武皇得仙王母去山雞晝鳴宫中樹溫泉決決出宫流宫使年年修玉樓禁兵去盡無射獵日西麋鹿登城頭梨園弟子偷曲譜頭白人間教歌舞春詞紅煙滿户日照梁天絲軟弱蟲飛揚菱花霍霍繞帷光美人對鏡著衣裳庭中並種相思樹夜夜還棲雙鳯凰遼東行遼東萬里遼水曲古戍無城復無屋黃雲蓋地雪作山不惜黃金貴衣服戰回各自收弓箭正西回面家鄉逺年年都郡送征人將與遼東作丘坂寧為草木鄉中生有身不向遼東行塞上梅天山路上一株梅年年花發黃雲下昭君已沒漢使回前後征人唯繫馬日夜風吹滿隴頭還隨隴水東西流此花若近長安路九衢年少無攀處戴勝詞戴勝誰與爾為名木中作窠墻上鳴聲聲催我急種榖人家向田不歸宿紫冠綵綵褐羽斑銜得蜻蜓飛過屋可憐白鷺滿緑池不如戴勝知天時鞦韆詞長長絲繩紫復碧嫋嫋橫枝髙百尺少年女兒重鞦韆盤巾結帶垂兩邊身輕裙薄易生力雙手向空如鳥翼下來立定重繫衣復畏斜風髙不得旁人送上那足貴終賭明璫鬭自起回回若與髙樹齊頭上寶叉從墮地眼前爭勝難為休足踏平地看始愁開池得古叉美人開池北堂下拾得寶叉金未化鳯皇半在雙股齊鈿花落處生黃泥當時墮地覔不得暗想窗中還夜啼可知將來對夫壻鏡前學梳古時髻莫言至死亦不遺還似前人初得時賽神曲男抱琵琶女作舞主人再拜聽神語新婦上酒勿辭勤使爾舅姑無所苦椒漿湛湛桂座新一雙長箭繫紅巾但願牛羊滿家宅十月報賽南山神青天無風水復碧龍馬上鞍牛服􅫓紛紛醉舞踏衣裳把酒路傍勸行客唐百家詩選卷十二
