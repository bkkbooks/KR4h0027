body:
  text: 唐百家詩選卷十六宋王安石編許渾三十二首大中末為郢州刺史凌歊臺在當塗縣西宋高祖築宋祖高高樂未回三千歌舞宿層臺湘潭雲盡暮山出巴蜀雪消春水來行殿有基荒薺合寢園無主野棠開百年便作萬年計嵒畔古碑空緑苔送蕭處士歸緱嶺别業醉斜烏帽髮如絲曽看仙人一局碁賓館有魚為客久鄉書無鴈到家遲緱山住近吹笙廟湘水行逢鼓瑟祠今夜月明何處宿九疑雲盡緑參差贈蕭兵曹廣陵隄上昔離居帆轉瀟湘萬里餘楚澤病時無鵩鳥越鄉歸去有鱸魚潮生水郭蒹葭響雨過山城橘柚疏聞說攜琴兼載酒邑人爭識馬相如凌歊臺送韋秀才雲起高臺日未沉數村殘照半嵓隂野蠶成繭桑柘盡溪鳥引雛蒲稗深帆勢依依投極浦鍾聲杳杳隔前林故山迢遞故人去一夜月明千里心送嶺南盧判官罷職歸華隂山居曾到劉琨鴈塞空十年書劒似飄蓬東堂舊屈移山志南國新留煮海功還挂一帆青草上更開三徑碧蓮中關西舊友應相問已許滄浪伴釣翁登故洛陽城禾黍離離半野蒿昔人城此豈知勞水聲東去市朝變山勢北來宫殿高鴉噪暮雲歸古堞鴈迷寒雨下空壕可憐緱嶺登仙子猶自吹笙醉碧桃懷舊居兵書一篋老無功故國郊扉在夢中藤蔓覆梨張谷暗草花侵菊庾園空朱門跡沗登龍客白屋心期失馬翁楚水吳山何處是北窗殘月照屏風哭虞將軍白首從軍未有名近將孤劒到江城巴童戍久能番語胡馬調多解漢行對雪夜窮黃石略望雲秋計黑山程可憐身死家猶逺汴水東流無哭聲晚自朝臺津至韋隱居郊園秋來鳧鴈下方塘繫馬朝臺步夕陽村徑繞山松葉滑柴門臨水稻花香雲連海氣琴書潤風帶潮聲枕簟涼西去磻溪猶萬里可能垂白待文王嘗與故宋補闕秋夕遊練湖南亭今復登賞愴然有感西風渺渺月連天同醉蘭舟未十年鵩鳥賦成人已沒嘉魚詩在世空傳滎枯盡寄浮雲外哀樂猶驚逝水前日暮長隄更回首一聲鄰笛舊山川灞上逢元九處士東歸瘦馬頻嘶灞水寒灞南高處望長安何人更結王生襪此客虛彈貢氏冠江上蟹螯沙渺渺塢中蝸殼雪漫漫舊交已盡新知少却伴漁師把釣竿經故丁補闕郊居死酬知已道終全波暖孤氷且自堅鵩上承塵才一日鶴歸華表亦千年風吹藥蔓迷樵徑水暗蘆花失釣船四尺孤墳何處是闔閭城外草連天祗命南海至廬陵逢表兄軍倅奉使淮海别後却寄盧橘花香拂釣磯佳人猶舞越羅衣三洲水淺魚來少五嶺山高鴈到稀客路晚依紅樹宿鄉關暗望白雲歸交親不念征南吏昨夜風帆去似飛送王總下第歸丹陽秦橋心斷楚江湄繫馬秋風酒一巵汴水月明東下疾練塘花發北枝遲青蕪定沒安貧處黃葉應催獻賦時憑寄家書問回報舊居還有故人知登尉陀樓劉項持兵鹿未窮自乘黃屋島夷中南來作尉任囂力北向稱臣陸賈功簫鼓尚陳今世廟旌旗猶鎮昔時宫越人未必知虞舜一奏薰絃萬古風題崔處士山居坐窮今古掩書堂二頃湖田一半荒荆樹有花兄弟樂橘林無實子孫忙龍歸曉洞雲猶濕麝過春山草自香向夜欲歸心萬里故園松月更蒼蒼酬綿竹于中丞使君見寄故人書信越褒斜新意雖多舊約賖皆就一麾先去國共謀三徑未還家荆巫夜隔巴西月鄢郢春連漢上花半月離居猶悵望可堪垂白各天涯金陵懷古玉樹歌殘王氣終景陽兵合戍樓空松楸逺近千官冢禾黍高低六代宫石燕拂雲晴亦雨江豚吹浪夜還風英雄一去豪華盡唯有青山似洛中秋晚雲陽驛西亭蓮花池心憶蓮塘秉燭遊葉殘花敗尚維舟煙開翠扇清風曉水泛紅衣白露秋神女暫來雲易散仙娥初去月難留空懷逺道無持贈醉倚西欄盡日愁題衛將軍廟將軍名逖陽羡人少習詩書學劒二十七遊并汾間神堯皇帝始建義旗逖以勇藝進備行列洎擒竇建德逖持挾槍劒前突後翼太宗顧而奇之天下既定録其功拜將軍宿衛以母老病且乞歸侍殘年辭㫖哀激詔許之既而以孝敬睦閨門以然信居鄉里及卒邑人懷其賢廟于荆溪之湄以平生弓甲懸東西廡下嵗時祠祭頗福其土焉文士王教撰碑辭實詳備而國史闕書其人因題是詩于廟壁武牢關下護龍旗挾槊彎弧馬上飛漢業未興王霸在秦軍才散魯連歸墳穿大澤埋金劒廟枕長溪挂鐵衣欲奠忠魂何處問葦花楓葉雨霏霏嵗暮自廣江至新興往復中道題峽山寺四首夜醉晨方醒孤吟恐失羣海鰌潮上見江鵠霧中聞未臘梅先實終冬草自薰樹隨山崦合泉到石稜分虎跡空林雨猿聲絶嶺雲蕭蕭異鄉鬢明日共絲棼薄暮緣西峽停橈一訪僧鷺巢橫臥栁猿飲倒垂藤水曲嵒千疊雲重樹百層山嵐寒殿磬溪雨夜船燈灘漲危槎沒泉衝怪石崩中臺一襟淚嵗杪别良朋密樹分蒼壁長溪抱碧岑海風聞鶴逺潭日見魚深松蓋環清韻榕根架緑隂南方大葉榕樹橫枝危者輒生根垂地如柱大洞丁多斫石蠻女伴淘金端州斫石浛洭縣淘金為業南浦驚春至西樓送月沉江流不回嶺何處寄歸心月在行人起千峰復萬峰海虛爭翡翠溪邏鬬芙蓉南方呼市為虛呼戍為邏新州有翡翠虛芙蓉邏古木高生斛隂池滿種松木斛花生於他樹槎枿池沼多謂之水松火探深洞燕香送逺潭龍南方持火於乳洞中取燕而食康州恱城縣有溫媪龍池隨來往舟船至人家或千里外皆以香火酒果送之藍塢寒先燒禾堂晚併舂種藍多在塢中先燒其地人以木槽舂禾謂之禾堂更投何處宿西峽隔雲鍾王居士笻杖倚柴關都城賣卜還雨中耕白水雲外斸青山有藥身長健無機性自閒即應生羽翼華表在人間寄題商洛王隱居近逢商洛客知爾住南塘草閣平春水柴門掩夕陽隨蜂收野蜜尋麝採生香更憶前年醉松花滿石牀别韋處士南北斷蓬飛别多相見稀更傷今日酒未换昔年衣舊友幾人在故鄉何處歸秦原向西路雲晚雪霏霏將赴京師留題孫處士山居草堂近西郭遙對敬亭開枕膩海雲起簟涼山雨來高歌懷地肺逺賦憶天台應學相如志終須駟馬回春日題韋曲野老村舍背嶺枕南塘數家村落長鶯啼幼婦懶蠶出小姑忙煙草近溝濕風花臨路香自憐非楚客春望亦心傷題倪居士舊居儒翁九十餘舊向北山居生寄一壺酒死留千卷書欄摧新竹少池淺故蓮疏但有子孫在帶經還荷鋤江上喜洛中親友繼至戰馬昔紛紛風驚嵩少塵全家南渡逺舊友北來頻罷酒松桂晚賦詩楊栁春誰言今夜月同是洛陽人獻白尹醉舞任生涯褐寬烏帽斜庾公先在郡疏傅早還家林晚鳥爭樹園春蝶護花高吟應更逸嵩路舊煙霞送從兄别駕歸蜀川從兄彥昭與桂陽令韋伯達貞元中俱為千牛伯達官至王府長史長慶中非罪受譴前年㑹赦復故秩詔未及而身已沒從兄自蜀而南發旅櫬歸葬塗上既而西還因成十韻贈别聞與湘南令童年侍玉墀家留秦塞曲官謫瘴溪湄道直姦臣屏寃深聖主知逝川東注疾霈澤北來遲清漢龍髯失蒼岑馬鬛移風悽聞笛處月慘罷琴時客路黃公廟鄉關白帝祠已稱鸚鵡賦寧望鶺鴒詩逺道書難達長亭酒莫持當憑蜀江水萬里寄相思項斯十二首字子遷江東人㑹昌四年擢進士第為潤州丹徒縣尉卒官題令狐處士溪居白髮已過半無心離此溪病嘗山藥遍貧起草堂低為月窗從破因詩壁重泥近來常夜坐寂寞與僧齊山友贈蘚花冠塵汙出山髮慙君青蘚冠此身閒未得終日戴應難好就松隂挂宜當枕石看會須尋道士簪去繞霜壇蠻家領得賣珠錢還歸銅柱邊看兒調小象打鼓試新船醉後眠神樹耕時語瘴煙不逢寒便老相問莫知年送華隂隱者往往到城市得非徴藥錢世人空識面弟子不知年自說能醫死相期更學仙近來移住處毛女舊峰前欲别花時人欲别每日醉櫻桃買酒金錢盡彈箏玉指勞歸期無嵗月客路有風濤錦段裁衣贈騏驎落剪刀留别張籍郎中省中重拜别兼領寄人書已念此行逺不應相問疏子城西並宅御水北同渠要取春前到乘閒候起居寄流人毒草不曾枯長流客健無霧開蠻市合船散海城孤象跡頻經水龍涎逺閉珠家人秦地老泣對日南圖長安退將塞外衝沙損眼明將來養病住秦京上高樓閣看星坐著白衣裳把劒行常說老身思鬭將最悲無力制蕃營翠眉紅臉和回鶻惆悵中原不用兵遙裝夜卷席貧拋壁下床且鋪他處對燈光欲行千里從今夜猶惜殘春發故鄉蚊蚋已生團扇急衣裳未了翦刀忙誰知更有芙蓉浦南去令人愁思長蒼梧雲氣何年化作愁漠漠便難收數㸃山能逺平鋪水不流濕連湘竹暮濃蓋舜墳秋亦有思鄉客看來盡白頭送宫人入道願隨仙女董雙成王母前頭作伴行初帶玉冠多誤拜欲辭金殿别稱名將敲碧落新齊磬却進昭陽舊賜箏旦暮焚香繞壇上步虛猶作按歌聲晚春花隂洞日光薄花開不及時當春無半樹經燒足空枝疏與香風㑹細將泉影移此中人到少開盡幾人知李頻十九首睦州遂安人乾符初自尚書工部員外郎為建州刺史秦原早望一忝鄉書薦長安未得回年光逐渭水春色上秦臺燕掠平蕪去人衝細雨來東風生故里又過幾花開送孫明秀才往潘州謁韋卿北鳥飛不到北人今去遊天涯浮瘴水嶺外問潘州草木春冬茂猿猱日夜愁定知遷客淚只敢對君流送友人之揚州一别長安後晨征便信雞河聲入峽急地勢出關低緑樹叢垓下青蕪濶楚西路長知不惡隨處好詩題送人入蜀天際蜀門開西看舉别杯何人不異禮上客自懷才花間青林發煙和緑水來臨卭行樂處莫到白頭回送德清喻明府棹返霅溪雲仍參舊使君州傳多古跡縣記是誰文水柵橫舟閉湖田立木分但如詩思苦為政即超羣南遊湘漢寄友人南去逺三京三湘五月行巴江雪水下楚澤火雲生向野聊中飲乘涼探暮程離懷不可說已近峽猿聲送鳯翔范書記京西無暑氣節候似全秋大幕來相辟高人去自由山川通蜀國日月近神州好共將軍話河蘭地未收送邊將防秋戎馬恐來奔詔發將軍入鴈門遙領短兵登隴首獨橫長劒向河源悠揚落日黃雲動莽蒼隂風白草翻若縱干戈更深入應聞收得到崑崙湘口送人中流欲暮見湘煙岸葦無窮接楚田去鴈逺衝雲夢雪離人獨上洞庭船風波盡日緣原轉星漢通宵向水連回首羡君偏有我故園歸醉又新年一本云歸去及新年太和公主還宫天驕發使犯邊塵漢將推功遂奪親離亂應無初去貌死生難有却回身禁花半老曾攀樹宫女多非舊識人重上鳯樓追故事幾多愁思向青春春日客舍言懷未識東南此路安青春日月坐銷難如何别却故園後五度花開五處看吳門月夜與曹太尉話别早晚更看吳苑月西齊長憶月當窗不知明夜誰家見應照離人隔楚江張司馬别業庭前樹盡手中栽先後花分幾番開巢鳥戀雛驚不起野人思酒去還來自拋官與青山近誰許身為白日催門外尋常行樂處重重履迹在莓苔鄂州頭陀寺上方高寺上方無不見天涯客上思迢迢西江帆挂東風急夏口城銜楚塞遙沙岸漁歸多濕網桑林蠶後盡空條感時歎物尋僧話惟向禪心得寂寥將赴黔州先寄本府中丞八月瞿塘倒底翻孤舟上得已銷魂幕中職罷猶趨府闕下官成未謝恩丹嶂聳空無過鳥青林覆水有垂猿感知肺腑終難說從此辭歸便掃門和友人下第北遊感懷聖代為儒可致身誰知又别五陵春青門獨出空啼鳥紫陌相逢盡醉人江島去尋垂望逺塞山來見舉頭頻且須共漉邊城酒何必陶家有白綸長安感懷一第知何日全家待此身空將灞陵酒酌送向東人送劉山人歸洞庭却共孤雲去高眠最上峰半湖乘早月中路入疏鐘秋盡蟲聲急夜深山雨重當時同隱者分得幾株松送友人往塞北朔北已秋風前程見磧鴻日西身獨去山轉路無窮樹隔高關斷沙連大漠空君看河外將早晚擬平戎唐百家詩選卷十六
