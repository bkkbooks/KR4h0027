body:
  text: 唐百家詩選卷十七宋王安石編李逺五首字求古大中中為忠州刺史贈寫御真李長史玉坐煙銷硯水清龍髯不動彩毫輕乍分隆準山河秀初點重瞳日月明宫女卷簾皆暗認侍臣開殿盡遙驚六朝供奉應無敵始覺僧繇浪得名失鶴秋風吹却九臯禽一片間雲萬里心碧落有情應悵望青天無路可追尋初來白雪翎猶短欲去丹砂頂漸深華表柱頭留語後更無消息到如今送人入蜀蜀客本多愁君今是勝遊碧藏雲外樹紅壓驛邊樓杜宇呼名語巴江學字流不知煙雨夜何處夢刀州聽話叢臺有客新從趙地回自言曾上古叢臺雲遮襄國天邊盡樹繞漳河地裏來絃管變成山鳥哢綺羅留作野花開金輿玉輦無蹤迹風雨誰知長碧苔黃陵廟詞黃陵廟前莎草春黃陵女兒蒨裙新輕舟小楫唱歌去水逺山長愁殺人雍陶二十五首大中中終簡州刺史盧嶽間居十韻擾擾走人寰爭如占得間防愁心付酒求靜力登山見藥芳時採逢花好處攀望雲開病眼臨澗洗愁顔春色流巖下秋聲碎竹間錦文苔點點錢樣菊斑斑路逺朝無客門深夜不關鶴飛高縹眇鶯語巧綿蠻養拙甘沉默忘懷絶險艱更憐雲外路空去又空還蜀中戰後感事十韻蜀國英靈地山重水又回文章四子盛道路五丁開詞客題橋去忠臣叱馭來臥龍同駭浪躍馬比浮埃已謂無妖土那知有禍胎蕃兵依漢栁蠻斾指江梅戰後悲逢血燒餘恨見灰空留犀猒怪無復酒除災嵗積萇𢎞怨春深杜宇哀家貧移未得愁上望鄉臺送于中丞使北蕃同用聲字朔將引雙旌山遙磧雪平經年通國信計日得蕃情野次依泉宿沙中望火行逺雕秋有力寒馬夜無聲看獵臨胡帳思鄉見漢城回鶻中有漢城來春擁邊騎新草滿歸程自述萬事誰能問一名猶未知貧當多纍日間過少年時燈下和愁睡花前帶酒悲無媒常委命轉覺命堪疑河隂新城高城新築壓長川虎踞龍盤氣色全五里似雲根不動一重如月暈初圓河流暗與溝池合山色遙將睥睨連自有此來當汴口武牢何用鎖風煙崔少卿池塘詠雙白鷺雙鷺應憐水滿池風飄不動頂絲垂立當青草人先見行傍白蓮魚未知一足獨拳寒雨裏數聲相呌早秋時林塘得爾須增價況與詩家物色宜哀蜀人為南蠻俘虜五章初出成都聞哭聲但見城池還漢將豈知佳麗屬蠻兵錦江南渡聞遙哭盡是離家别國聲過大渡河蠻使許之泣望鄉國大渡河邊蠻亦愁漢人將渡盡回頭此中郵寄思鄉淚南去應無水北流出青溪關有遲留之意欲出鄉關行步遲此生無復却回時千寃萬恨何人見唯有空山鳥獸知别嶲州一時慟哭雲日為之變色越嶲城南無漢地傷心從此便為蠻寃聲一慟悲風起雲暗青天日下山入蠻界不許有悲泣之聲雲南路出陷河西毒草長青瘴色低漸近蠻城誰敢哭一時收淚羡猿啼過舊宅看花花即昔年手植山桃野杏兩三栽樹樹繁花去後開今日主人相引看誰知曽是客移來和河南白尹西池北新葺水齋招賞十二韻二室峰前水三川府右亭亂流深竹徑分繞小花汀池角通泉脈堂心豁地形坐中寒瑟瑟床下細泠泠雨夜思巫峽秋朝想洞庭千年孤鏡碧一片逺天青魚戲搖紅尾鷗間退白翎荷傾瀉珠露沙亂動金星藤架如紗帳苔牆似錦屏龍門人少到仙棹自多停遊憶高僧伴吟招野客聽餘波不能惜便欲養浮萍蜀中經蠻後友人馬又見寄茜馬渡瀘水北來如鳥輕幾年期鳯闕一日破龜城此地有征戰誰家無死生人悲還舊里鳥喜下空營弟姪意初定交朋心尚驚自從經難後吟苦似猿聲送契玄上人南遊紅葉落湘川楓明映水天尋鐘過楚寺擁錫上瀧船病客思留藥迷人待説禪南中多古迹應訪虎溪泉和劉補闕秋園寓興六首水木夕隂冷池塘秋意多庭風吹故葉階露淨寒莎愁燕窺燈語情人見月過砧聲聽已别蟲響復相和閉門無事後此地即山中但覺鳥聲異不知人境同晚花開為雨殘果落因風獨坐還吟酌詩成酒已空自得家林趣常時在外稀對僧餐野食迎客著山衣鬬雀翻簷散驚蟬出樹飛功成他日後何必五湖歸秋色庭蕪上清朝見露華疏篁抽晚笋幽藥吐寒芽引水新渠淨登臺小徑斜人來多愛此蕭爽似山家禁掖朝回後林園勝賞時野人來辨藥庭鶴住看碁晚日明丹棗朝霜潤紫梨還因重風景猶自有秋詩聖代少封事間居方屏喧漏寒雲外闕木落月中園山鳥宿簷樹水螢流洞門無人見清景林下自開樽送徐山人歸睦州舊隱君在桐廬何處住草堂應與戴家鄰初歸山犬翻驚主久别江鷗却避人終日欲為相逐計臨時空羡獨行身秋風釣艇遙相憶七里灘西片月新天津橋春望津橋春水浸紅霞煙栁風絲拂岸斜翠輦不來金殿閉宫鶯銜出上陽花寄永樂殷堯藩明府古縣蕭條秋景晚昔年陶令亦如君頭巾漉酒臨黃菊手板支頤向白雲百里豈能容驥足九霄終自别雞羣相思不恨書來少佳句多從闕下聞塞上宿野寺塞土蕃僧老天寒疾上關逺煙平似水高樹暗如山去馬朝常急行人夜始間更深聽刁斗時到磬聲間章碣四首唐末人旅舍早起迹暗心多感神疲夢不遊驚舟同厭夜獨樹對悲秋曉角和人戰殘星入漢流門前早行子敲鐙唱離憂焚書坑竹帛煙銷帝業虛關河空鎖祖龍居坑灰未冷山東亂劉項原來不讀書春别擲下離觴指亂山趨程不待鳯笙殘花邊馬嚼金銜去樓上人垂玉筯看栁陌雖然風裊裊蔥河猶自雪漫漫殷勤莫厭貂裘重恐犯三邊五月寒送謝進士歸閩百越風煙接巨鰲還鄉心壯不知勞雷霆入地建溪險星斗逼人黎嶺高却擁木綿吟麗句便攀龍眼醉香醪名場聲利喧喧在莫向林泉改鬢毛施肩吾一首字希聖洪州人效古興金雀無舊叉緗綺無舊裾唯有一寸心長貯萬里夫南軒夜蟲織已促北牖飛蛾繞殘燭秪言衆口鑠千金誰信獨愁銷片玉不知嵗晚歸不歸又將啼眼縫征衣陳陶六首武宣時人自稱三教布衣間居雜興一顧成周力有餘白雲間釣五溪魚中原莫道無麟鳯自是皇家結網疏長壽一作愛真人王子喬五松山月伴吹簫從他浮世悲生死獨駕蒼麟入九霄鄱陽秋夕憶昔鄱陽旅遊日曽聽南家爭搗衣今夜重聞舊砧杵當時還見鴈南飛旅次銅山途中先寄溫州韓使君亂山滄海曲中有橫陽道束馬過銅梁苕華坐堪老鴆鳴高崖裂熊鬬深樹倒絶壑無坤維重林失蒼昊躋攀寡儔侣扶接念輿皂俯仰栗嵌空無因掇靈草梯窮聞戍鼓魂續賴丘禱蔽豁天地歸縈紆村落好悠悠思蔣徑擾擾愧商皓馳想永嘉侯應傷此懷抱題徐稚湖亭伏龍山橫洲渚地人如白蘋自生死洪崖成道二千年唯有徐君播青史泉州刺桐花詠猗猗小艷夾通衢晴日薰風笑越姝只是紅芳移不得刺桐屏障滿中都李群玉七首字文山澧州人大中中宰相崔鉉進其詩以處士除𢎞文館校書郎經費拾遺所居呈封員外雲臥竟不起少微空隕光惟應孔北海為立鄭公鄉舊館苔蘚合幽齋松菊荒空餘書帶草日日上階長古鏡明月何處來朦朧在人境得非軒轅作妙絶世莫並瑶匣開旭日白電走孤影泓澄一尺天徹底函霜景氷輝凜毛髮使我肝膽冷忽驚行深幽面落九秋井雲天入掌握爽朗神魄靜不必負局仙金沙發光炯隂沉畜靈怪可與天地永恐為悲龍吟飛去在俄頃傷思八月白露濃芙蓉抱香死紅枯金粉墮寥落寒塘水西風團葉下疊縠參差起不見棹歌人空垂緑房子洞庭入澧江寄巴丘故人四月桑半枝吳蠶初弄絲江行好風日燕舞輕波時去事旋成夢來歡難預期唯憑東流水日夜寄相思自澧浦東遊江表途出巴丘投員外從公虞短翮後飛者前攀鸞鶴翔力微應萬里矯首空蒼蒼誰昔探花源考槃西嶽陽高風動商洛綺皓無馨香一朝下蒲輪清輝照巖廊孤醒立衆醉古道何由昌經術震浮蕩國風掃齊梁文襟即玄圃筆下成琳琅霞水散吟嘯松筠奉琴觴氷壺避皎潔武庫羞鋒鋩小子書代耕束髮頗自強難哉水投石壯志空摧藏十年侣龜魚垂髮在三湘巴歌掩白雪鮑肆埋蘭芳騷雅道未消何憂名不彰飢寒束困厄默塞飛星霜百志一不成東波擲年光塵生脫粟甑萬里違高堂中夜恨火來焚燒九回腸平明梁山淚緣枕霑匡床依泊洞庭波木葉忽已黃哀砧搗秋色曉月啼寒螿復此棹孤舟雲濤浩茫茫朱門待媒贄短褐誰揄揚仰羡野陂鳧無心憂稻粱不如天邊鴈南北皆成行男兒白日間變化未可量所希困辱地剪拂成騰驤咋筆話肝肺詠兹枯魚章何由首西路目斷白雲鄉洞庭驛樓雪夜宴集奉贈前湘州張員外昔與張湘州間登嶽陽樓目窮衡巫表興盡荆吳秋擲筆落郢曲巴人不能酬是時簪裾會景物窮冥搜謬忝玳筵秀得陪文苑遊幾篇雲楣上風雨沈銀鈎盧溪道中曉發潺湲亭夜泊潺湲水風篁拂石瀨琴聲九十里光奔覺來眼寒落夢中耳曽向三峽行巴江亦如此章孝標一首太和中為山南東道從事試大理評事長安秋夜田家無五行水旱卜蛙聲牛犢乘春放兒孫候暖耕池塘煙未起桑柘雨初晴嵗晚香醪熟村村自送迎馬戴三首博士易水懷古荆卿西去不復返易水東流無盡期落日蕭條薊城北黃沙白草任風吹送客南遊擬卜何山隱高秋指嶽陽葦乾雲夢色橘熟洞庭香疏雨殘虹影回雲背鳥行靈均如可問一為哭清湘寄襄陽王公子君馬勒金羈君家貯玉笄白雲登峴首碧樹醉銅鞮澤廣荆州北山多漢水西鹿門知不隱芳草自萋萋劉得仁二首題邵公院無事門多掩隂階竹掃苔徑風吹雪聚渴鳥啄氷開樹向寒山得人從瀑布來終期天目老擎錫逐雲回悲老宫人白髮宫娃不解悲滿頭猶自插花枝曽緣玉貌君王寵準擬人看似舊時高蟾三首春明月斷魂清藹藹平蕪歸思緑迢迢人生莫遣頭如雪縱得春風亦不銷灞陵亭一條歸夢朱絃直一片離心白羽輕明日灞陵新霽後馬頭煙樹緑相迎偶作丁當玉珮三更雨平帖金閨一覺雲明日薄情何處去風流春水不知君崔塗八首字禮仙光啓四年登進士第夕次洛陽道中秋風吹故城城下獨吟行高樹鳥已息古原人尚耕流年川暗度往事月空明不復嘆岐路馬前塵夜生春夕旅懷水流花謝兩無情送盡東風過楚城蝴蝶夢中家萬里杜鵑枝上月三更故園書動經年絶華髮春唯兩鬢生自是不歸歸便得五湖煙景有誰爭上已日永崇里言懷未敢分明賞物華十年如見夢中花遊人過盡衡門掩獨自憑欄到日斜蜀城春望天涯憔悴身一望一沾巾在處有芳草滿城無故人懷材皆得路失計獨傷春青鏡不忍照鬢毛應更新鸚鵡洲春眺悵望春襟鬱未開重臨鸚鵡益堪哀曹瞞尚不能容物黃祖何因解愛才幽島暖聞燕鴈去曉江晴覺蜀波來誰人正得風濤便一點輕帆萬里回感花繡軛香韀夜不歸少年爭忍最紅枝東風一陳黃昏雨又到繁華夢覺時過陶徴君舊居陶令曽居此弄琴遺世情田園三畝緑軒冕一銖輕衰栁自無主白雲猶可耕不隨陵谷變應只有高名孤鴈幾行歸塞盡念爾獨何之暮雨相呼失寒塘欲下遲渚雲低暗渡關月冷相隨未必逢矰繳孤飛自可疑唐百家詩選卷十七
