body:
  text: 唐百家詩選卷十九宋王安石編劉滄四首字藴靈大中八年進士及第長洲懷古野燒空原盡荻灰吳王此地有樓臺千年事往人何在半夜月明潮自來白鳥影從江樹沒清猿聲入楚雲哀停車日晚薦蘋藻風靜寒塘花正開經煬帝行宫此地曽經翠輦過浮雲流水竟如何香銷南國美人盡怨入東風芳草多殘栁宫前空露葉夕陽川上浩煙波行人遙起廣陵思古渡月明聞棹歌與僧話舊巾舄同時下翠微舊遊因話事多違南朝古寺幾僧在北嶺空林唯鳥歸莎徑晚煙凝竹塢石池春色染苔衣此來相見又相别即是關河朔鴈飛咸陽懷古經過此地無窮事一望悽然感廢興渭水故都秦二世咸原秋草漢諸陵天空絶塞聞邊鴈葉盡孤村見夜燈風景蒼蒼多少恨寒山半出白雲層劉威一首遊東湖黃處士園林偶向東湖更向東數聲雞犬翠微中遙知楊栁是門處似隔芙蓉無路通樵客出來山帶雨漁舟過去水生風物情多與間相稱所恨求安計不同曹鄴一首始皇陵下作千金買魚燈泉下照狐兔行人上陵過却弔扶蘇墓壘壘壙中物多於養生具若使山可移應將秦國去舜殁雖在前今猶未封樹曹松十四首長安春日浩浩看花晨六街揚逺塵塵中一丈日誰是晏眠人御栁垂著水野鶯啼破春徒云多失意猶自惜離秦晨起曉色教不睡卷簾清氣中林殘數枝月髮冷一梳風並鳥含鍾語欹河隔霧空莫疑營白日道路本無窮秋日送方干遊上元天高淮泗白料子趨修程汲水疑山動揚帆覺岸行雲離京口樹鴈入石頭城後夜分遙念諸峰霧露生金谷園當年歌舞時不説草離離今日歌舞盡滿園秋露垂夏日東齋三庚到秋伏偶來松檻立熱少清風多開門放山入送喻坦之遊太原北鄙征難盡詩愁滿去程廢巢侵燒色荒冢入鋤聲逗野河流濁離雲磧日明并州戎壘地角動引風生塞上邊寒來處濶今日復明朝河凌去聲堅通馬胡雲缺見雕沙中程獨泣鄉外隱誰招回首苦經嵗靈州生栁條題鶴鳴泉仙鶴曾鳴處泉兼半井苔直峰拋影入片月寫光來瀲灔侵顔冷深沉尉眼開何因值丹頂滿汲石瓶回已亥嵗二首南國江山入戰圖生民何計樂樵蘇憑君莫話封侯事一將功成萬骨枯波間一戰百神愁兩岸強兵過未休誰道滄江總無事近來常共血爭流南海旅次憶歸休上越王臺歸思臨高不易裁為客正當無鴈處故園誰道有書來城頭早角吹霜盡郭裏殘潮蕩月回心似百花間未得年年爭發被春催陪湖南李中丞宴隱溪璋竹林啼鳥不知休羅列飛橋水亂流觸散栁絲回玉勒約開蓮葉上蘭舟酒邊舊侣真何遜雲裏新聲是莫愁若值主人嫌晝短應陪秉燭夜深遊别湖上主人門繫釣舟雲滿岸借君幽致坐移旬湖村夜呌白蕪鴈菱市曉喧深浦人逺水日邊重作雪寒林燒後别生春不辭更住醒還醉太一東峰歸夢頻商山贈野叟垂白商於原下住兒孫共死一身忙木弓未得長離手猶與官家射麝香張喬二首送河西從事結束佐戎旃河西住幾年隴頭隨日去磧裏寄星眠水近沙連帳程遙馬入天聖朝思上䇿重待奏安邊送進士許棠離鄉積嵗年歸路逺依然夜火山頭市春江樹杪船干戈愁鬢改瘴癘喜家全何處營甘旨潮濤浸薄田劉駕一首釣臺懷古澄流可濯纓嚴子但垂綸孤坐九層石逺笑清渭濵潛龍飛上天四海豈無雲清氣不零雨安使洗塵氛我來吟高風髣佛見斯人江月尚皎皎江石亦磷磷如何臺下路明日又迷津崔魯十二首春日長安即事一百五日又欲來梨花梅花參差開行人自笑不歸去瘦馬獨吟真可哀杏酪漸香鄰舍粥榆煙將變舊爐灰玉樓春暖清歌夜肯信愁腸獨九回春晚嶽陽城言懷翠煙如鈿栁如環晴倚南樓獨看山江國草花三月晚帝京塵夢一年間虛舟尚笑縈難解飛鳥空慙倦未還何似不羈詹父伴睡煙歌月老潺潺煙花零落過清明異國光隂老客情雲夢夕陽愁裏色洞庭春浪坐來聲天邊一與舊山别江上幾看芳草生獨憑欄千意難寫暮笳嗚軋調孤城過蠻溪渡緑楊如髮雨如煙立馬危橋獨喚船山口斷雲迷舊路渡頭芳草憶前年身隨逺道徒悲梗詩賣明時不值錢歸去楚臺還有計釣船春雨日高眠暮春對花病香無力被風欺多在青苔少在枝馬上行人莫回首斷君腸是欲殘時華清宫四首銀河漾漾月輝輝樓礙星邊織女機橫玉呌雲清似水滿空霜逐一聲飛障掩金雞蓄禍機翠環西拂蜀雲飛珠簾一閉朝元閣不見人歸見燕歸草遮回磴絶鳴鑾雲樹深深碧殿寒明月自來還自去更無人倚玉闌干門橫金鎖悄無人落日秋聲渭水濱紅葉下山寒寂寂濕雲如夢雨如塵春晚泊船江村芳草青青古渡頭漁家住處暫維舟殘花半樹悄無語細雨滿天風似愁家信不來春又晚客程難盡水空流自憐愛失心期約看取花時更逺遊山路見花曉紅初坼露香新獨立空山冷笑春春意自知無主惜恣風吹逐馬蹄塵岸梅含情含態一枝枝斜壓漁家短短籬惹袖尚憐香半日向人如訴雨多時初開偏稱雕梁畫未落先愁玉笛吹行客見來無去意解帆煙浦為題詩張蠙六首字象文昭宗時為尚書膳部員外郎社日村居鵝湖山下稻粱肥豚穽雞棲對掩扉桑柘影斜春社散家家扶得醉人歸送友人歸武陵聞近桃源住無村不是花戍旗招海客廟鼓集江鴉别島垂橙實間田長荻芽遊秦未得意看即更離家别後寄友人上馬如飛鳥飄然隔去塵共看今夜月獨作異鄉人就養江田熟移居井賦新襄陽堪卜隱應與孟家鄰送友人赴涇州幕杏園沉飲散榮别就嘉招日月相期盡山川獨去遙府樓明蜀雪關磧轉胡雕縱有煙塵動應隨上䇿銷野泉逺出白雲中長年聽不窮細聲縈石亂寒色入潭空挂壁聊成雨穿林别起風溫泉非爾類源發在深宫述懷白首成空事無歡可替悲空餘酒中興猶似少年時方干二首字雄飛新定人咸通中進士不第隱會稽之鏡湖及江東人謂為玄英先生君不來逺路東西欲問誰寒來無處寄寒衣去時初種庭前樹樹已勝巢人未歸山中愛山却把圖書賣嗜酒空教僮僕賖只向階前便漁釣那知枕上有雲霞暗泉出石飛仍咽小徑通橋直復斜窗竹未抽今夏筍庭梅曽試當年花姓名未及陶𢎞景髭鬢白於薑子牙松月水煙千古在未知終久屬誰家王駕四首字大用河中人大順初進士及第仕至尚書禮部員外郎自稱守素先生與司空圖鄭谷相善為詩友古意夫戍蕭關妾在吳西風吹妾妾憂夫一行書信千行淚寒到君邊衣到無過故友居鄰笛寒吹日落初舊居今已别人居亂來兒姪皆分散惆悵僧房認得書晴景雨前初見花間蘂雨後兼無葉裏花蛺蝶飛來過牆去應疑春色在鄰家亂後曲江憶昔爭遊曲水濱未春長有探春人遊春人盡空池在直至春深不似春杜荀鶴四首字彥之自稱九華山人大順中登進士第春宫怨早被嬋娟誤欲粧臨鏡慵承恩不在貌教妾若為容風暖鳥聲碎日高花影重年年越溪女相憶採芙蓉雪風攪長空寒骨生先於曉色報窗明江湖不見飛禽影巖谷唯聞折竹聲巢穴幾多相似處路岐兼得一般平擁袍公子莫言冷中有樵夫跣足行溪興山雨溪風卷釣絲瓦甌蓬底獨斟時醉來睡著無人喚流下前溪也不知哭具韜交朋來哭我來歌喜傍山家葬薜蘿四海十年人殺盡似君埋少不埋多唐百家詩選卷十九
