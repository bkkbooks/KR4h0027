body:
  text: 唐百家詩選卷七宋王安石編戴叔倫四十七首酬贈張衆甫野人無本意散木任天材分向空山老何言上苑來迢遙千里道依倚九層臺出處寧知命輪轅豈自媒更慙張處士相與别蒿萊客舍秋懷呈駱正字士則無言堪自喻偶坐更相悲木落驚年長門間惜草衰買山猶未得諫獵又非時設被浮名繫歸休漸欲遲早行寄朱山人放山曉旅人去天高秋氣悲明河川上沒芳草露中衰此别又萬里少年能幾時心知剡溪路聊且寄前期贈殷御史亮日日河邊見水流傷春未已復悲秋山中舊宅無人住來往風塵共白頭寄中書李舍人紓萍翻蓬自卷不共本心期復入重城裏頻看百草滋水流歸思逺花發長年悲盡日春風起無人見此時贈李山人唐此意無所欲閉門風景遲栁條將白髮相對共垂絲酬盩厔耿少府湋見寄方丈蕭蕭落葉中暮天深巷起悲風流年不盡人自老外事無端心已空家近小山當海畔身留環衛隱牆東遙聞相訪頻逢雪一醉寒宵誰與同贈康老人洽酒泉布衣舊才子少小知名帝城裏一篇飛入九重門樂府喧喧聞至尊宫中美人皆唱得七貴因之盡相識南鄰北里日經過處處淹留樂事多不脫敝裘輕錦綺長吟佳句掩笙歌賢王貴主於我厚駿馬蒼頭如已有暗將心事隔風塵盡擲年光逐杯酒青門幾度見春歸折栁尋花送落暉杜陵往往逢秋暮望月臨風攀古樹繁霜入鬢何足論舊國連天不知處爾來倏忽五十年却憶當時思眇然多識故侯悲宿草曾看流水沒桑田百人會中一身在被褐飲瓢終不改陌頭車馬共營營不解如君任此生襄州遇房評事由移家住漢隂不復問華簪貰酒宜城近燒田夢澤深暮山逢鳥入寒水見魚沈與物皆無纍終年愜本心暮春遊長沙東湖贈辛兖州巢父二首湘流分曲浦繚繞古城東岸轉千家合林開一鏡空人生無事少心賞幾回同且復忘羈束悠悠落照中回環路不盡歷覽意彌新古木畬田火澄江蕩漿人緩歌尋極浦一醉送殘春莫恨長沙逺他年憶此辰同兖州張秀才過王侍御參謀宅賦十韻栁字十年官不進斂迹無怨咎漂蕩海內遊淹留楚鄉久因參戎幕下寄宅湘川口翦竹開廣庭瞻山敞虛牖間門早春至陋巷新晴後覆地落殘梅和風裊輕栁逢迎車馬客邀結風塵友意愜時會文夜長聊飲酒秉心轉孤直沈照隨可否豈學屈大夫憂慙對漁叟同辛兖州巢父盧副端嶽相思獻酬之作因抒歸懷兼呈辛魏二院長楊長寧暮角發高城情人坐中起臨觴不及醉分散秋風裏雖有明日期離心若千里前歡反惆悵後會還如此焉得夜淹留一回終宴喜羇遊復牽役皆去重湖水早晚泛歸舟吾從數君子對月答元明府山下孤城月上遲相留一醉本無期明年此夕遊何處縱有清光知見誰酬袁太祝長卿小湖村山居書懷見寄背江居隙地辭職作遺人耕鑿資餘力樵漁逐四鄰麥秋桑葉大梅雨稻田新籬落栽山果池塘養海鱗放歌聊自足幽思忽相親余亦歸休者依君老此身清明日送鄧芮二子還鄉鐘鼓喧離室車徒促夜裝晚廚新變火輕栁暗翻霜傳鏡看華髮持杯話故鄉每嫌兒女淚今日自沾裳送汶水王明府何時别故鄉歸去佩銅章親族移家盡閭閻百戰場背關餘古木近塞足風霜遺老應相賀知君不下堂送裴明州郎中徵效南朝體瀟水連湘水千波萬浪中知君未得去慙愧石尤風送觀察李判官巡郴州行役各逺路煙波同旅愁輕橈上桂水大艑下揚州何處成後會今朝分舊遊離心比楊栁蕭颯不勝秋京口送皇甫司馬副端曾舒州辭滿歸東都潮水忽復過雲帆儼若飛故園雙闕下左宦十年歸晚景照華髮涼風吹别衣淹留更一醉老去莫相違奉同汴州李相公勉送郭布殿中出巡軒車出東閣都邑繞南河馬首先春至人心比歲和省風傳隱恤持法去煩苛却想埋輪者論功此日多送東陽顧明府罷歸祖帳臨鮫室黎人擁鷁舟坐藍高士去繼組鄙夫留白日落寒水青楓繞曲洲相看作離别一倍不禁愁戲留顧十一明府江明雨初歇山暗雲猶濕未可動歸橈前程風浪急栁花歌送客往桂陽滄浪渡頭栁花發斷續因風飛不絶搖煙拂水積翠間綴雪含霜誰忍攀夾岸紛紛送君去鳴棹孤尋到何處移家深入桂水源種栁新成花更繁定知别後消散盡却憶今朝傷旅魂送前上饒嚴明府攝玉山用山字家在故林吳楚間冰為溪水玉為山更將舊政化鄰邑遙見逋人相逐還撫州對事後送外生宋垓歸饒州覲侍呈上姊夫淮汴初喪亂蔣山烽火起與君隨親族奔迸辭故里京口附商客海門正狂風憂心不敢住夜發驚浪中雲開方見日潮盡爐峰出石壁轉棠隂鄱陽寄茅室淹留三十年分種越人田骨肉無半在鄉園猶未旋爾家習文藝旁究天人際父子自相傳優遊聊卒歲學成不求達道勝那厭貧時入閭巷醉好是羲皇人頃因物役牽偶逐簪組輩謗書喧朝市撫已慙淺昧世業大小禮近通顔謝詩念渠還領會非敢獨為師潘處士宅會别相邀寒景晚惜别故山空鄰里疏林在池塘野水通十年多難後一醉幾人同復此悲行子蕭蕭逐轉蓬江上别張勸年年五湖上厭見五湖春長醉非關酒多愁不為貧舊山迷道路清洛暗風塵今日扁舟别俱為滄海人汝南别董校書擾擾倦行役相逢陳蔡間何為百年內不見一人間對酒惜餘景問程愁亂山秋風萬里至又出穆陵關留别李道州圻瀧路下丹徼郵童揮畫橈山回千騎隱雪斷兩鄉遙魚滬擁寒溜畬田落逺燒維舟更相憶惆悵坐通宵永康孫明府頲秩滿將歸枉路訪别門前水流咽城下亂山多非是還家路寧知枉騎過風煙復欲隔悲笑屢相和不學陶公醉無因奈别何將赴湖南留别東陽舊寮兼示吏人智力苦不足黎氓殊未安忽從新命去復隔舊寮歡曉路整車馬離亭會衣冠冰堅細流咽燒盡亂峰寒耆老相餞送兒童亦悲酸桐鄉寄生怨欲話此情難奉天酬别鄭諫議雲逵盧拾遺景亮見别之作巨孽盜都城傳聞天下驚陪臣九江畔走馬來赴難伏奏見龍顔旋持手詔還單車不可駐朱檻未遑攀故人出相餞共悲行路逺臨岐荷贈言對酒獨傷魂世故山川險憂多思慮昏重隂蔽芳月疊嶺明舊雪泥積轍更深木冰花不發鄭侯間世賢忠孝乃雙全大義棄妻子至淳易生死知心三四人越境千餘里駿馬帳前發驚塵路傍起樓頭俯首看莫敢相留止拜闕奉良圖留中沃聖謨洗兵收魏郡誘敵討幽都名亞典屬國良選諫大夫從容九霄上談笑解隂符盧生富才術特立居近密採掇獻吾君明廷視聽新寬饒狂自比汲黯直為鄰就列繼三事主文當七人可憐長守道不覺五逢春昔去城南陌各為天際客關河煙霧深寸步音塵隔羇旅忽相遇别離又兹夕前悲涕未乾後喜心已戚而我方老大頗為風眩迫夫君並少年何爾鬢鬚白惆悵語不盡徘徊情轉劇一樽且共持以慰長相憶撫州處士胡泛見送北回兩館至南昌縣界查溪蘭若别移樽鋪山曲祖帳查溪隂鋪山即逺道查溪非故林悽然誦新詩落淚霑素襟郡政我何有别情君獨深禪庭古樹秋宿雨清沉沉揮袂千里逺悲傷去住心將巡郴永途中作行役留三楚思歸又一春自疑冠下髮聊此鏡中人機息知名誤形衰恨道貧空將舊泉石長與夢相親過郴州江盡湘南戍山分桂北林火雲三月合石路九疑深暗谷隨風過危亭共鳥尋羇魂已愁絶不復待猿吟桂陽北嶺偶過野人所居聊書即事呈王永州雍李道州圻犬吠空山響林深一徑存隔雲尋板屋渡水到柴門日晝風煙靜花明草樹繁乍疑秦世客漸識楚人言不記逃鄉里居然長子孫種田燒險谷汲井鑿高原畦葉藏春雉庭柯宿旅猿嶺隂無瘴癘地隙有蘭蓀內户均皮席枯瓢沃野飱逺心知自負幽賞詎能論轉步重崖合瞻途落照昏他時願攜手莫比武陵源下鼻亭瀧行八十里聊狀艱險寄青苗鄭副端朔陽瀧水天際來鼻山地中坼盤渦幾十處疊溜皆千尺直寫卷沈沙驚翻衝絶壁淙淙振崖谷洶洶竟朝夕人語不自聞日光亂相射艤舟始搖漾舉棹旋奔激既下同建瓴半空方避石前危苦未盡後險何其迫倏閃疾風雷蒼皇蕩魂魄因隨伏流出忽與跳波隔逺想欲回軒豈兹還泛鷁雲涯多候館努力勤登歷湘南即事盧橘花開楓葉衰出門何處望京師沅湘日夜東歸去不為愁人住少時少女生日感懷五逢晬日今方見置爾懷中自惘然乍喜老身辭逺役翻悲一笑隔重泉欲教針線嬌難解暫弄琴書性已便還有蔡家殘史籍可能分與外人傳江鄉故人偶集客舍天秋月又滿城闕夜千重還作江南會翻疑夢裏逢風枝驚暗鵲露草覆寒蛬羇旅長堪醉相留畏曉鐘張評事涉秦居士系見訪郡齋即同賦中字軺車忽枉轍郡府自生風遣吏山禽在開樽野客同古牆抽臘笋喬木揚春鴻能賦傳幽思清言盡至公城欹殘照入池曲大江通此地人來少相歡一醉中聽歌回馬上贈崔法曹秋風裏許杏花開杏樹傍邊醉客來共待夜深聽一曲醒人騎馬斷腸回去婦怨出户不敢啼風悲日悽悽心知恩義絶誰忍分明别下坂車轔轔畏逢鄉里親空持牀前幔却見家中人忽辭王吉去為是秋胡死欲比今日情煩寃不相似昭君詞漢宫若逺近路在寒沙上到死不得歸何人共南望女耕田行乳燕入巢笋成竹誰家二女種新榖無人無牛不及犁持刀斫地翻作泥自言家貧母年老長兄從軍未娶嫂去年災疫牛囤空截絹買刀都市中頭巾掩面畏人識以刀代牛誰與同姊妹相攜心正苦不見路人唯見土疏通畦隴防亂苗整頓溝塍待時雨日正南岡下餉歸可憐朝雉擾驚飛東鄰西舍花發盡共惜餘芳淚滿衣夜發袁江寄李潁州劉侍郎時二公留貶在此半夜回舟入楚鄉月明山水共蒼蒼孤猿更發秋風裏不是愁人亦斷腸郎士元二十一首送李將軍赴定州雙旌漢飛將萬里愛橫戈春色臨邊盡黃雲出塞多鼓鼙悲絶漠烽戍隔長河想到隂山北天驕已請和送張南史一云寄李紓雨餘深巷靜獨酌送殘春車馬雖嫌僻鶯花不棄貧蟲聲黏户網鼠迹印牀塵借問山陽會如今有幾人聞蟬寄友人李端亦有此詩未知孰是昨日始聞鶯今朝蟬又鳴朱顔向華髮定是幾年程故國白雲逺間居青草生因垂數行淚書寄十年兄送長沙韋明府秋入長沙縣蕭條旅宦心煙波連桂水官舍映楓林雲日楚天暮沙汀白露深遙知訟堂裏佳政在鳴琴題劉相三湘圖昔日醉衡霍邇來憶南州今朝平津邸兼得瀟湘遊稍辨郢門樹依然芳杜洲微明三巴峽咫尺萬里流飛鳥不知倦逺帆生暮愁涔陽指天末北渚空悠悠枕上見漁父坐中當狎鷗誰言魏闕下自有東山幽塞上曲寶刀塞下兒輕身百戰曾百勝壯心竟未嫖姚知白草山頭日初沒黃沙戍下悲歌發蕭條靜夜邊風吹獨倚營門望秋月關羽祠送高員外還荆州將軍稟天姿義勇冠今昔走馬百戰場一劒萬人敵誰為感恩者竟是思歸客流落荆巫間徘徊故鄉隔離筵對祠宇灑酒暮天碧去去勿復言銜悲向陳迹郢城西樓吟連山盡處水縈回山上戍門臨水開朱欄直下一百丈日暖遊鱗自相向昔人愛險閉層城今人愛間江復清沙洲楓岸無來客草緑花紅山鳥鳴宿杜判官江樓適楚豈吾願思歸秋向深故人江樓月永夜千里心葉落覺鄉夢鳥啼驚越吟寥寥更何有斷續空城砧送韋湛判官高閣晴江上重陽古戍間聊因送歸客更此望鄉關惜别心能醉經秋鬢自斑臨流興不盡惆悵水雲間春宴王補闕城東别業栁陌乍隨洲勢轉花源忽傍竹隂開能將瀑水清人境直取流鶯送酒杯山下古松當綺席簷前片雨滴春苔地主同聲復同舍留歡不畏夕陽催柏林寺南望溪上遙聞精舍鐘泊舟微徑度深松青山霽後雲猶在畫出東南四五峰長安逢故人數年音信斷不意在長安馬上相逢久人中欲認難一官今懶道雙鬢竟羞看莫問生涯事只應持釣竿聽鄰家吹笙鳳吹聲如隔綵霞不知牆外是誰家重門深鎖無尋處疑有碧桃千樹花贈韋司直聞君感歎二毛初舊友相依萬里餘烽火有時驚暫定甲兵無處可安居客來吳地星霜久家在平陵音信疏昨日風光還入户登山臨水意何如蓋少府新除江南尉問風俗聞君作尉向江潭吳越風煙到自諳客路尋常隨竹影人家大底傍山嵐緣溪花木偏宜逺避地衣冠盡向南惟有夜猿啼海樹思鄉望國意難堪酬二十八秀才見寄昨夜山月好故人果相思清光到枕上嫋嫋涼風時永意能在我惜無攜手期湘夫人蛾眉對湘水遙哭蒼梧山萬乘既已歿孤舟誰忍還至今楚竹上猶有淚痕斑南有涔陽路渺渺多新愁桂酒神降時回風江上秋彩雲忽無處碧水空安流酬王季友題半日村别業兼呈李明府村映寒原日已斜煙生密竹早歸鴉長溪南路當羣岫半景東鄰照數家門通小徑連芳草馬飲春泉踏淺沙欲待主人林上月還思潘令縣中花冬夕寄青龍寺源公斂屨入寒竹安禪過漏聲高松殘子落深井凍痕生罷磬風枝動懸燈雪屋明何當招我宿乘月上方行送李騎曹之靈武寧侍一歲一歸寧涼天數騎行河來當塞曲山逺與沙平縱獵旗風卷聽笳帳月生新鴻引寒色回日滿京城唐百家詩選卷七
