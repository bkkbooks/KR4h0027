body:
  text: 唐百家詩選總集類提要臣等謹案唐百家詩選二十巻舊本題宋王安石編其去取絶不可解自宋以来疑之者不一曲為解者亦不一然大抵指為安石惟晁公武讀書志云唐百家詩選二十巻皇朝宋敏求次道編次道為三司判官嘗取其家所藏唐人一百八家詩選擇其佳者凡一千二百四十六首為一編王介甫觀之因再有所去取且題云欲觀唐詩者觀此足矣世遂以為介甫所纂其説與諸家特異按讀書志作於南宋之初去安石未逺又晁氏自元祐以来舊家文獻緒論相承其言當必有自邵博聞見後錄引晁説之之言謂王荆公與宋次道同為羣牧司判官次道家多唐人詩集荆公盡即其本擇善者籖帖其上令吏抄之吏厭書字多輒移所取長詩籖置所不取小詩上荆公性忽畧不復更視今世所謂唐百家詩選曰荆公定者乃羣牧司吏人定也其説與公武又異然説之果有是説不應公武反不知考周煇清波雜志亦有是説與博所記相合煇之曽祖與安石為中表故煇持論多左袒安石當由安石之黨以此書不惬於公論造為是説以解之託其言於説之博不考而載之耳此本為宋乾道中倪仲傳所刋前有仲傳序其書世乆不傳國朝康熙中商邱宋犖始購殘本八巻刻之既又得其全本續刻以行而二十巻之數復完當時有疑其偽者閻若璩厯引高棅唐詩品彚所稱以明皇早度蒲闗詩為開巻第一陳振孫書錄解題所稱非惟不及李杜韓三家即王維韋應物元白劉栁孟郊張籍皆不及以證其真又殘本佚去安石原序若璩以臨川集所載補之其文具載若璩潛邱劄記中惟今本所録共一千二百六十二首較晁氏所記多十六首若璩未及置論或傳寫讀書志者誤以六十二為四十六歟至王昌齡出塞詩諸本皆作若使龍城飛將在此本作盧城飛將若璩引唐平州治盧龍縣以證之然詩人誤用往往而然不必曲為之諱唐三百年更無一人稱盧龍為盧城者何獨昌齡杜撰地名此其過尊宋本之失有不可為典要者矣乾隆四十三年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀唐百家詩選原序音有妙而難賞曲有髙而寡和古今通然無惑乎唐百家詩選之淪没於世也予自弱冠肄業於香溪先生門嘗得是詩於先生家藏之秘竊愛其㧞唐詩之尤清古典麗正而不冶凡以詩鳴於唐有驚人語者悉羅於選中於是心惟口誦㡬欲裂去夏課而學焉先生知之一日索而鑰諸笥越至於今不復過目者有年矣頃有親戚游宦南昌因得之於臨川以歸首以出示發巻數過不啻如獲遺珠之喜惜其道逺難致且字畫漫滅近世士大夫嗜此詩者往往不能無恨故鏤板以新其傳庶幾丞相荆國公銓擇之意有所授於後人也雅徳君子儻於三冬餘暇玩索唐世作者用心則發而為篇章殆見游刃餘地運斤成風矣乾道已丑四月望日倪仲傳序唐百家詩選原序余與宋次道同為三司判官時次道出其家藏唐詩百餘編諉余擇其精者次道因名曰百家詩選廢日力於此良可悔也雖然欲知唐詩者觀此足矣
