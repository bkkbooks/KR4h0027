body:
  text: 唐百家詩選巻二十宋王安石編吳融二十七首字子華昭宗時為翰林學士戸部侍郎壬戍嵗閿鄉卜居六載抽毫侍禁闈不堪多病決然歸五陵年少如相問阿對泉頭一布衣阿對是楊伯起家僮嘗引泉灌蔬其泉至今尚在野廟古原荒廟掩莓苔何處喧喧鼓笛來日暮鳥啼人散盡野風吹起紙錢灰小逕礙竹妨花一逕幽攀縁應對玉峰頭若教須似康莊好便有高車駟馬憂閒望三㸃五㸃映山雨一枝兩枝臨水花蛺蝶狂飛掠芳草鴛鴦熟睡翹暖沙闕下新居非已業江南舊隠是誰家東還西去都無計却羨暝歸林上鵶即事抵鵲山前寄掩扉便甘終老脫朝衣曉窺清鏡千峰入暮倚長松獨鶴歸雲裏引來泉脈細雨中移得藥苗肥何須一筯鱸魚鱠始挂孤帆問釣磯書懷傍巖依樹結簷楹夏物蕭疎景更清灘響忽高何處雨松隂自轉逺山晴見多隣犬遥相認來慣幽禽近不驚爭敢便誇饒勝亊九衢塵裏免勞生海棠太尉園林兩樹春今番禺太尉徐公興化亭子有海棠兩株年年奔走探花人今來獨傍荆山看回首長安落戰塵寄貫休休公何處在知我宦情無已似馮唐老方知武子愚一身仍更病雙闕又須趨若得重相見冥心學半銖楚事悲秋應亦抵傷春屈宋當年並楚臣屈原云目極千里傷春心宋玉云悲哉秋之為氣何事從來好時節只將惆悵付詞人金橋感事太行和雪疊晴空二月郊原尚朔風飲馬早聞臨渭北射鵰今欲過山東百年徒有伊川歎五利寧無魏絳功日暮長亭正愁絶哀笳一曲戍煙中送䇿上人昨來非有意今去亦無心闕下抛新院江南指舊林缾添新澗緑笠卸晩峰隂八字如相許終辭尺組尋松江晩泊樹逺天疑盡江奔地欲隨孤帆落何處殘日更新離客是淒凉本情為繫滯枝寸腸無計免應只楚猿知廢宅風飄碧瓦雨摧垣却有隣人為鏁門幾樹好花虚白晝滿庭荒草易黄昏放魚池涸蛙爭聚棲燕梁空雀自喧不獨淒凉眼前事咸陽一火便寒原途中一棹歸何處蒼茫落照昏無人因失路有樹始知村湖岸春耕廢江城戰鼓喧儒冠竟相悞學劍盡乗軒岐下聞杜鵑化去蠻鄉北飛來渭水西為多亡國恨不忍故山啼怨已驚秦鳯靈應識漢雞數聲煙漠漠餘思草萋萋樓迥波無際林昏日又低如何不腸斷家近五雲溪杏花三韻春物競相妬杏花應最嬌紅輕欲愁殺粉薄似啼消願作南華夢翩翩遶此條華清宫三首中原無鹿海無波鳯輦鸞旗出幸多今日故宫歸寂寞太平功業在山河四郊飛雪暗雲端唯此宫中落旋乾緑樹碧簷相掩映無人知道外邊寒漁陽烽火照函關玉輦悤悤下此山一曲羽衣聽不盡至今遺恨水潺潺春寒固教梅忍落休與杏藏嬌已過冬疑剩將來暖未饒玉堦殘雪在羅薦暗香銷莫問王孫恨煙蕪尚寂寥彭門用兵後經汴路長亭一望一徘徊千里關河百戰來細栁舊營猶鏁月祁連新冡已封苔霜凋緑野愁無際燒接黄雲慘不開若比江南更牢落子山詞賦莫興哀隋堤風物已凄凉堤下仍多舊戰場金鏃有苔人拾得蘆花無主鳥銜將秋聲暗促河聲急野色遥連日色黄獨上寒城正愁絶戍鼙驚起鴈行行高侍御話皮博士池中白蓮因寄白玉花開緑錦池風流御史報人知㸔來應是雲中墮偷去須從月下移已被亂蟬傕晼晩更禁凉雨動䙰褷習家秋色堪圖畫只欠山公倒接䍦新安道中翫流水一渠春碧弄潺潺密竹繁花掩映間㸔處便須終日住算來爭得此身閒縈紆似接迷人洞清冷應連有雪山上却征車更回首了然塵土不相關憶山泉穿雲落石細湔湔杳杳疑聞弄管絃千仞灑來寒碎玉一泓深處碧涵天煙迷葉亂尋難見月好風清聽不眠春雨正多歸未得只應流恨更潺湲紅樹一聲南鴈已先紅槭槭淒淒葉葉同自是孤根非暖地莫驚他木耐秋風曉煙散去隂全薄明月臨來影半空長憶洞庭千萬樹照山横浦夕陽中微雨天清織未遍風急舞難成粉重低飛蝶黄濃不語鶯乍隨春靄亂還放夕陽明惆悵池塘逺荷珠㸃㸃輕韓偓五十九首字致光一云字致堯昭宗時翰林學士承㫖尚書兵部侍郎雨後月中玉堂閒坐銀臺直北金鑾外暑雨初晴皓月中唯對松篁聽刻漏更無塵土翳虚空緑香熨齒氷盤果清冷侵肌水殿風夜久忽聞鈴索動玉堂西畔響丁東六月十七日召對自辰及申方歸本院清暑簾開散異香恩深咫尺對龍章花應洞裏常時發日向壺中特地長坐久忽疑槎犯斗歸來兼恐海生桑如今冷笑東方朔唯用詼諧侍漢皇中秋禁直星斗疎明禁漏殘紫泥封後獨憑欄露和玉屑金盤冷月射珠光貝闕寒天襯樓臺籠苑外風吹歌管下雲端長卿秪為長門賦未識君臣際㑹難錫宴日作是嵗大稔内出金帛錫百官充觀稼宴學士院别賜越綾百匹委京尹句當後宰相一日宴于興化亭玉銜花馬踏香街詔遣追懽綺席開中使押從天上去是日在外四學士排門齊入同進狀辭赴宴所奉差學士院使二人押去外人知自日邊來臣心淨比漪漣水聖澤深於㶑灔杯纔有異恩頒稷卨已將優禮及鄒枚清商適向梨園降妙妓新行峽雨回不敢通宵離禁直晩乗殘醉入銀臺冬至夜作天復二年隨駕在鳯翔府中宵忽見動葭灰料得南枝有早梅四野便應枯草緑九重先覺凍雲開隂氷莫向河源塞陽氣今從地底回不道慘舒無定分却憂蚊響又成雷秋霖夜憶家隨駕在鳯翔府垂老何時見弟兄背燈悲泣到天明不知短髪能多少一滴秋霖白一莖出官經峽石縣天復三年三月二十日作謫宦過東畿所抵州名濮故里欲清明臨風堪慟哭溪長栁似帷山暖花如醭逆旅訝簪裾南路以久無儒服經過皆相聚觀野老悲陵谷暝鳥影聯翩驚狐尾纛遬尚得佐方州信是皇恩沐訪同年虞部二十五郎中四年二月在湖南䇿蹇相尋犯雪泥厨煙未動日平西門庭野水䙰褷鷺隣里短牆咿喔雞未入慶霄君擇肉畏逢華轂我吹虀地爐貰酒成狂醉更覺襟懷得喪齊春隂獨酌寄同年李郎中春隂漠漠土脈潤寒氣微微風意和閒嗤入甲奔競態醉唱落調漁樵歌詩道揣量疑可進宦情刓缺轉無多酒酣狂興依然在無奈千莖鬢雪何雪中過重湖信筆偶成道方時險擬如何謫去甘心隠薜蘿青草湖將天暗合白頭浪與雪相和旗亭臘酎踰年熟水國春寒向晩多處困不忙仍不怨醉來唯是欲傞傞寄湖南從事索漠襟懷酒半醒無人一為解餘酲岸頭栁色春將盡船背雨聲天欲明去國正悲同旅鴈隔江何忍更啼鶯蓮花幕下風流客試與温存譴逐情翫水禽此後七首醴陵縣作兩兩珍禽渺渺溪翠衿紅掌淨無泥向陽眠處莎成毯踏水飛時浪作梯依倚雕梁輕社燕抑揚金距笑晨雞勸君細認漁翁意莫遣絙羅誤穏棲早雪翫梅有懷親友北陸候纔變南枝花已開無人同悵望把酒獨徘徊凍白雪為伴寒香風是媒何因逢越使腸斷謫仙材小隠借得茅齋岳麓西擬將身世老鋤犂清晨向市煙涵郭寒夜歸村月照溪爐為窻明僧偶坐松因雪折鳥驚啼靈椿朝菌由來事却笑莊生始欲齊曛黑古木侵天日已沉露華涼冷潤衣襟江城曛黑人行絶唯有啼烏伴夜砧醉着萬里清江萬里天一村桑柘一村煙漁翁醉着無人喚過午醒來雪滿船早起三韻萬樹緑楊垂千般黄鳥語庭花風雨餘岑寂如村塢依依官渡頭晴陽照行旅即目萬古離懷憎物色幾年愁緒溺風光廢城沃土肥春草野渡空船蕩夕陽倚道向人多脈脈為情因酒易倀倀宦途弃擲須甘分回避紅塵是所長贈易卜崔江處士袁州白首窮經通祕義青山養老度危時門傳組綬身能退家學樵漁跡更奇四海盡聞龜䇿妙九霄堪嘆鶴書遲壺中日月將何用借與閒人試一窺乙丑嵗九月蕭灘鎭忽得楊迢員外書賀余除戎曹仍舊承㫖還緘後因書四十字旅寓在江郊秋風正寂寥紫泥虚寵奬白髪已漁樵事徃淒涼在時危志氣銷若為將朽質猶擬杖於朝登南臺僧寺無奈離腸日九回强攄懷抱立高臺中華地向城邊盡外國雲從島上來四序有花長見雨一冬無雪却聞雷日宫紫氣生冠冕試望扶桑病眼開花時與錢尊師同醉因成二十字橋下淺深水竹間紅白花酒仙同避世何用厭長沙有矚晩涼閒步向江亭黙黙看書旋旋行風轉滯帆狂得勢潮來諸水寂無聲誰將覆轍詢長䇿願把棼絲屬老成安石本懷經濟意何妨一起為蒼生蜻蜓碧玉眼睛雲母翅輕於粉蝶瘦於蜂坐來迎拂波光舞可是慇懃為蓼叢宫栁此後二首在内庭作莫道秋來芳意違宫娃猶似妬蛾眉幸當玉輦經過處不怕金風浩蕩時草色長承垂地葉日華先照映樓枝澗松亦有凌雲分爭似盤根太液池苑中上苑離宫處處迷相風高與露盤齊金堦鑄出狻猊立玉柱雕成狒狇啼外使調鷹初得案五坊外案使以鷹隼初調習始能擒獲謂之得案中官過馬不教嘶上每乘馬必閹官馭以進謂之過馬既乘之而後躞蹀嘶鳴也笙歌繡錦雲霄裏獨許詞臣醉似泥即目書牆暗記移花日洗瓮先知醖酒期須信閒人有忙事早來衝雨覔漁師過臨淮故里交遊昔嵗已凋零第宅今來亦變更舊廟荒涼時饗絶諸孫饑凍一官成五湖竟負他年志百戰空垂異代名榮盛幾何流落久遣人襟抱薄浮生亂後却至近甸有感乙夘年作狂童容易犯金門比屋齊人作旅魂夜戸不扃生茂草春渠自溢浸荒園關中却見屯邊卒塞外翻聞有漢村堪恨無情清渭水渺茫依舊遶秦原寄隣莊道侣聞說經旬不啓關藥窻誰伴醉開顔夜來雪壓村前竹剩見溪南幾尺山亂後春日途經野塘世亂他鄉見落梅野塘晴煖獨徘徊船衝水鳥飛還住袖拂楊花去又來季重舊遊多喪逝子山新賦極悲哀眼看朝市成陵谷始信昆明是刼灰惜花皺白離情高處切膩紅愁態靜中深眼隨片片沿流去恨滿枝枝被雨淋總得苔遮猶慰意便教泥汚更傷心臨軒一盞悲春酒明日池塘是緑隂半醉水向東南更不回紅顔白髮遞相催壯心暗逐高歌盡往事空因半醉來雲䕶鴈霜籠淡月雨連鶯曉落殘梅西樓悵望芳菲節處處斜陽草似苔漢江行次村寺雖深已暗知幡竿殘日迥依依沙頭有廟青林合驛步無人白鳥飛牧笛自由隨草逺漁歌得意扣舷歸竹園相接春波暖痛憶家鄉舊釣磯春盡惜春連日醉昏昏醒後衣裳見酒痕細水浮花歸别澗斷雲含雨入孤村人閒易有芳時恨地勝難招自古魂慚愧流鶯相厚意清晨猶為到西園贈湖南李思齊處士兩板船頭濁酒壺七絲琴畔白髭鬚三春日日黄梅雨孤客年年青草湖燕俠氷霜難狎近楚狂鋒刃觸凡愚知余絶粒窺仙事許到名山看藥爐睡起睡起牆隂下藥欄瓦松花白閉柴關斷年不出僧嫌癖逐日無機鶴伴閒塵土莫尋行止處煙波長在夢魂間終撑舴艋稱漁叟賖買湖心一崦山寄友人傷時惜别心交加搘頤一向千咨嗟曠野風吹寒食月廣庭煙著黄昏花長擬曛酣遣世事若為局促問生涯夫君亦是多情者幾度將愁泥酒家見别離者因贈之征人草草盡戎裝征馬蕭蕭立路傍罇酒䦨珊將逺别秋山邐迤更斜陽白髭兄弟中年後瘴海程途萬里長曾向天涯懷此恨見君嗚咽更凄涼傷亂岸上花根總倒垂水中花影幾千枝一枝一影寒山裏野水野花清露時故國幾年猶戰鬭異鄉終日見旌旗交親流落身羸病誰在誰亡兩不知南亭每日在南亭南亭似僧院人語靜先聞鳥啼深不見松瘦石稜稜山光溪澱澱塹蔓墜長茸島花垂小蒨行簪隠士冠臥讀先賢傳更有興來時取琴彈一遍太平谷中翫水上花山頭水從雲外落水面花自山中來一溪紅㸃我獨惜幾樹密房誰見開應有妖魂隨暮雨豈無香跡在蒼苔凝眸不覺斜陽盡忘逐樵人躡石回雨坐來䔩䔩山風急山雨隨風暗原隰樹帶繁聲出竹聞溪將大㸃穿籬入餉婦寥翹布領寒牧童擁茸蓑衣濕此時高味共誰論掩鼻吟詩空佇立幽獨幽獨起侵晨山鶯啼更早門巷掩蕭條落花滿芳草煙愁魂共逺春與人同老黙黙又依依凄然此懷抱江行浪蹙青山江北岸雲含黑雨日西邊舟人偶語憂風色行客無聊罷書眠爭似槐花九衢裏馬蹄安穏慢揚鞭初赴朝集輕寒著背雨凄凄九陌無塵未有泥還是平時舊滋味慢垂鞭袖向街西向隅守道得途遲中兼遇亂離剛膓成繞指𤣥髮變垂絲客路少安處病床無穏時弟兄消息絶獨歛向隅眉秋郊閒望有感楓葉微紅近有霜碧雲秋色滿吳鄉魚衝駭浪雪鱗健鴉閃夕陽金背光心為感恩長慘戚鬢縁經亂早蒼浪可憐廣武山前事楚漢寧教作戰場襄漢旅道値隣境軍新過村落皆空因有此感水自潺湲日自斜盡無雞犬有鳴鵶千村萬落似寒食不見人煙空見花深院鵝兒唼啑梔黄嘴鳯子輕盈膩粉腰深院下簾人晝寢紅薔薇架碧芭蕉辛酉冬隨駕日作今方追憶全篇因附於此曳裾談笑殿西頭忽聽征鐃從冕旒鳯蓋行時移紫氣鸞旗駐處認皇州曉題御服頒羣吏夜發宫嬪詔列侯雨露涵濡三百載不知誰擬殺身酬安貧手風慵展八行書眼暗休尋九局圖窻裏日光飛野馬案頭筠管長蒲盧謀身拙為安蛇足報國危曾捋虎鬚滿世可能無黙識未知誰擬試齊竽殘春旅舍旅舍殘春宿雨晴怳然心地憶咸京樹頭蜂抱花鬚落池面魚吹栁絮行禪伏詩魔歸靜域酒衝愁陣出奇兵兩梁免被塵埃汚拂拭朝簪待眼明鵲偏承雨露潤毛衣黑白分明衆所知高處營巢親鳯闕靜時閒語上龍墀化為金印新祥瑞飛向銀河舊路岐莫怪天涯棲不穏託身須是萬年枝隰州新驛盛德巳圖形胡為忽搆兵燎原雖自及誅亂不無名擲鼠須防誤連雞莫憚驚本期將係虜末䇿但嬰城肘腋人情變朝廷物論生果聞荒谷縊旋覩藁街烹帝怒今方息時危喜暫清始終俱以此天意甚分明偶題俟時輕進固相妨實行丹心仗彼蒼蕭艾轉肥蘭蕙瘦可能天亦妬馨香湖南絶少含桃偶人以新摘者見惠感事傷懷因成四韻時節雖同氣候殊未知堪薦寢園無合充鳯食留三島誰許鶯偷過五湖苦笋恐難同象七秦中謂三月為櫻笋時酪漿無復瑩蠙珠湖南無牛酪之味金鑾嵗嵗長宣賜忍淚看天憶帝都每嵗初進之後先宣賜學士翠碧鳥天長水逺網羅稀保得重重翠碧衣挾彈少年多害物勸君莫近五陵飛憶故都故都遥想草萋萋上帝深疑亦自迷塞鴈已侵池籞宿宫鴉猶戀女牆啼天涯烈士空垂涕地下强魂必噬臍掩鼻計成終不覺馮諼無路効鳴雞唐百家詩選巻二十
