body:
  text: 唐百家詩選卷九宋王安石編耿湋六首大歷中為右拾遺秋晚臥疾寄司空拾遺曙盧少府綸寒几坐空堂疏髯似積霜老醫迷舊疾朽藥誤新方晚果紅低樹秋苔緑遍牆慙非蔣生徑不敢望求羊早朝鐘鼓餘聲裏千官向紫微冒寒人語少乘月燭來稀清漏聞馳道輕霞映瑣闈猶看嘶馬處未啓掖垣扉秋日反照入閭巷憂來與誰語古道少人行秋風動禾黍路傍老人老人獨坐倚官樹欲語澘然淚便垂陌上歸心無産業城邊戰骨有親知餘生尚在艱難日長路多逢輕薄兒緑水青山雖似舊如今貧病復何為送友人遊江南逺别悠悠白髮新江潭何處是通津潮聲偏懼初來客海味唯甘久住人漠漠煙光前浦晚青青草色定山春汀洲更有南回雁亂起聨翩北向秦邠州留别終歲山川路生涯總幾何艱難為客慣貧賤受恩多暮角飄長韻寒流起細波懸愁茂陵宅春色又相過李端九首古别離水國葉黃時洞庭霜落夜行舟聞商估宿在楓林下此地送君還茫茫似夢間後期知幾日前路轉多山巫峽通湘浦迢迢隔雲雨天晴見海檣月落聞津鼓人老自多愁水深難急流清宵歌一曲白首對汀洲過谷口元贊善所居入谷訪君來秋泉已難涉林間人獨坐月下山相接重露濕蒼苔明燈照黃葉故交一不見素髮何稠疊古别離與君桂陽别令君嶽陽待後事忽差池前期日空在木落雁嗷嗷洞庭波浪高逺山雲似蓋極浦樹如毫朝發能幾里暮來風又起如何兩處愁皆在孤舟裏昨夜天月明長川寒且清菊花開欲盡薺菜泊來生下江帆勢速五兩遙相逐欲問去時人知投何處宿空令猿嘯時泣對湘潭竹烏栖曲白馬逐朱車黃昏入狹斜狹斜栁樹烏爭宿爭枝未得飛上屋東房少婦壻從軍每聽烏啼知夜分代從兄衡送友入關聞君帝城去西望一霑巾落日見秋草暮年逢故人非才長作客有命懶謀身近更嬰衰病空思老漢濱晚夏聞蟬寄戴廣文前郎士元有此詩未知孰是昨日鶯囀聲今朝蟬忽鳴朱顔向華髮定是幾年程故國白雲逺間居青草生因垂數行淚書報十年兄早春雪夜寄盧綸呈祕書元丞聞君隨謝朓春夜宿山前看竹雲垂地尋僧雪滿船熊寒方入樹魚樂稍離泉猶是羇愁客誰知惜故年荆門雨歌送從兄赴夔州余兄佐郡經西楚餞行因賦荆門雨􅀢􅀢燮燮聲漸繁浦裏人家收市喧重隂大點過欲盡碎浪柔紋相與翻雲間悵望荆衡路萬里青山一時暮琵琶寺裏響空廊尉斗陂前濕荒戍沙尾長檣發漸稀竹竿草屩涉流歸夷陵逺色半成燒漢上遊倡始濯衣船門相對多商估葛服龍鍾篷下語自是湘川石燕飛非關齊地商羊舞曾為江客念江行腸斷秋荷雨打聲摩天古木不可見住嶽高僧空得名今朝拜手臨欲别遙憶荆門雨中發贈康洽黃髮康兄酒泉客平生出入王侯宅今朝醉臥又明朝忽憶舊鄉頭已白流年恍惚瞻西日陳事蒼茫指南陌聲名常壓鮑參軍班位不過楊執戟邇來七十遂無幾空是咸陽一布衣後輩輕肥賤衰朽故侯門館許相依自言萬物有移改始信桑田變成海同時獻賦人皆盡共壁題詩君獨在步出東城風景和青山滿眼少年多漢家尚壯今則老髮短心長知奈何華堂舉杯莫嘆晚龍鍾相見誰能免君今已返我正來朱顔宜笑能幾回借問蒙蘢花樹下誰家畚鍤築高臺于武陵八首或作于鄴孤雲南北各萬里有雲心更間因風離海上伴月到人間洛浦少高一作佳樹長安無舊山徘徊不可住漠漠又東還南遊有感杜陵無厚業不得駐車輪重到曾遊處多非舊主人東風千嶺樹西日一洲蘋又渡湘江水湘江水復春客中楚人歌竹枝遊子淚沾衣異國久為客寒宵頻夢歸一封書未返千樹葉皆飛南過洞庭水更應消息稀洛陽道浮世若浮雲千回故復新旋添青草冢更有白頭人歲暮客將老雪晴山欲春行行車與馬不盡洛陽塵夜與故人别白日去難駐故人非舊容今宵一别後何處更相逢過楚水千里到秦山幾重語來天又曉月落滿城鐘感懷青山長寂寞南望獨高歌四海故人盡九原新冢多西沉浮世日東注逝川波不使年華駐此生看幾何長信宫簟涼秋氣初長信恨何如拂黛月生指解鬟雲滿梳一從悲畫扇幾度泣前魚坐聽南宫樂清風搖翠裾過侯王故第過此一酸辛行人淚有痕獨殘新碧樹猶擁舊朱門歌歇雲初散簷空燕尚存不知彈鋏客何處感新恩熊孺登一首貞元中人經古墓碑折松枯山火燒夜臺從閉不曾朝那將逝者比流水流水東流逢上潮張繼三首字懿孫大歷中人楓橋夜泊月落烏啼霜滿天江楓漁火對愁眠姑蘇城外寒山寺夜半鐘聲到客船閶門即事耕夫占募逐樓船春草青青萬頃田試上吳門看郡郭清明幾處有新煙過春申君廟春申祠宇空山裏古柏隂隂石泉水日暮江南無主人彌令過客思公子蕭條寒景傍山村寂寞誰知楚相尊當時珠履三千客趙使懷慙不敢言包佶四首字幼正貞元初為祕書監丹陽郡公酬于侍郎湖南見寄桂嶺千崖斷湘流一派通長沙今賈傅東海舊于公章甫經殊俗離騷繼雅風金閨文作字玉匣氣成虹翰墨時無侣丹青夙在公主恩留左掖人望積南宫巧拙循名異浮沉顧位同九遷歸上略三已契愚衷責謝庭中禮悲寬塞上翁楚材欣有適燕石愧無功山曉重嵐外林春苦霧中雪花翻海鶴波影倒江楓去札頻逢信回帆早挂空避賢方有日非敢愛微躬贈廬山白鶴觀劉尊師蒼蒼五老霧中壇杳杳三山洞裏官手護崑崙象牙簡心推霹靂棗枝盤春飛雪粉加毫潤曉潄瓊膏冰去齒寒漸恨流年筋力少唯思露冕事星冠嶺下臥疾寄劉長卿員外唯有貧兼病能令親愛疏歲時供放逐身世付空虛脛弱秋添絮頭風曉廢梳波瀾喧衆口藜藿靜吾廬喪馬思開卦占梟懶發書十年江海隔離恨子知豫近獲風痺之疾題寄所懷病夫將已矣無可答君恩衾枕同羇客圖書委外孫久來從吏道常欲奉空門急走機先息欹行力漸煩無醫能却老有變是遊魂鳥宿還依伴蓬飄莫問根寓形齊指馬觀境制心猿唯借南榮地清晨暫負暄包何一首江上田家近海川原薄人家本自稀黍苗期臘酒霜葉是寒衣市井誰相識漁樵夜始歸不須騎馬問恐畏狎鷗飛鮑防二首雜感漢家海內承平久萬國戎王皆稽首天馬嘗銜苜蓿花胡人歲獻蒲桃酒五月荔枝初破顔朝辭象郡夕函關雁飛不度桂陽嶺馬走先過林邑山甘泉御果垂仙閣日暮無風香自落逺物皆重近皆輕雞雖有德不如鶴送薛補闕入朝平原門下十餘人獨受恩多未殺身每歎陸家兄弟少更憐楊氏子孫貧柴門豈斷施行馬魯酒那堪醉近臣賴有軍中遺令在猶將談笑對風塵張登二首貞元中為漳州刺史送王主簿遊南海得錢字平生推久要留滯共三年明日東南路窮荒霧露天曠懷常寄酒素業不言錢道在貧非病時來醜亦妍過山乘蠟屐涉海附樓船行矣無為恨宗門有大賢因遇小雪日戲題絶句甲子徒推小雪天刺桐猶緑槿花然陽和長養無時歇却是炎洲雨露偏皇甫冉上二十首字茂政大歷中王縉為河南節度鎮徐州辟掌書記後終左補闕巫山峽巫峽見巴東迢迢出半空雲藏神女館雨到楚王宫朝暮泉聲落寒暄樹色同清猿不可聽偏在九秋中與張補闕王鍊師自徐方清河路同舟南下於臺頭寺留别趙員外裴補闕同賦雜韻一首朝朝春事晚泛泛行舟逺淮海思無窮悠揚煙景中幸將仙子去復與故人同高枕隨流水輕帆任逺風鐘聲野寺迥草色古城空送别高臺上徘徊共惆悵懸知白日斜定是猶相望屏風上各賦一物得攜琴客不是向空林應當就磐石白雲知隱處芳草迷行迹如何祗役心見爾攜琴客獨孤中丞筵陪餞韋使君赴升州中司龍節貴上客虎符新地控吳襟帶才光漢搢紳泛舟應度臘入境便行春何處歌來暮長江建業人酬李郎中侍御秋夜登福州城樓見寄辛勤萬里道蕭索九秋殘月照閩中夜天凝海上寒王程無地逺主意在人安遙寄登樓作空知行路難送元晟還於潛山所居深山秋事早歸去復何如裛露收新稼迎寒葺舊廬題詩即招隱作賦是間居别後空相憶嵇康懶寄書送康判官往新安賦得江路西南永不向新安去那知江路長猿聲比廬霍水色勝瀟湘驛樹收殘雨漁家帶夕陽何須愁旅泊使者有輝光酬盧十一過宿乞還方未遂日夕望雲林况復逢春草何勞問此心間門公務散枉策故情深遙夜他鄉酒同君梁甫吟三月三日義興李明府後亭泛舟江南煙景復如何聞道新亭更可過處處藝蘭春浦緑萋萋藉草逺山多壺觴須就陶彭澤風俗猶傳晉永和更使輕橈徐轉去微風落日水增波酬裴十四得宴字淮海各聨翩三年方一見素心終不易玄髮何須變舊國想平陵春山滿陽羡鄰雞莫遽唱共惜良宵宴夜集張諲所居得飄字江南成久客門館日蕭條唯有圖書在多傷鬢髮凋諸生陪講誦稚子給漁樵虛室寒燈靜空階落葉飄滄洲自有趣誰道隱須招送顧萇往新安由來山水客復道向新安半是乘潮便全非行路難晨裝林月在野飯浦沙寒嚴子千年後何人釣舊灘送段明府遙夜此何其霜空殊杳靄方嗟異鄉别暫是同心會海林秋更疏野水寒猶大離人轉吳岫旅雁從燕塞日夕望前期勞心白雲外送王司直西塞雲山逺東風道路長人心勝潮水相送過潯陽同李蘇州傷美人玉佩石榴裙當年嫁使君專房獨見寵傾國衆皆聞歌舞常無對幽明忽此分陽臺千萬里何處作行雲題高雲客舍孤興日自深浮雲非所仰窗中西城峻樹外東川廣晏起簪葛巾間吟倚藜杖阮公道在醉莊子生恆養五栁轉扶疏千峰恣來往清秋香粳穫白露寒菜長吳國滯風煙平陵延夢想時人趣纓辨高鳥違羅網世事徒糾紛吾心方浩蕩唯將山與水處處諧真賞同諸公有懷絶句舊國迷江樹他鄉近海門移家南渡久童稚解方言送李録事赴饒州北人南去雪紛紛雁叫汀沙不可聞積水長天隨逺客荒城極浦足寒雲山從建業千峰出江至潯陽九派分借問督郵才弱冠府中年少不如君寄高雲南徐風日好悵望毗陵道毗陵有故人一見恨無因獨戀青山久唯令白髮新每嫌持手板時見著頭巾煙景臨寒食農桑起仲春家貧仍嗜酒生事今何有芳草遍江南勞心憶攜手酬權器南望江南滿山雪此情惆悵將誰説徒隨羣吏不曾間顧與諸生為久别聞君靜坐轉耽書種樹葺茅還舊居終日白雲應自足明年芳草又何如人生有懷苦不展出入公門猶未免回舟朝夕待春風先報華陽洞深淺唐百家詩選卷九
